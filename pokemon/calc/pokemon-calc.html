*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito','Noto Sans JP',sans-serif;color:#1a2a3a;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(circle,rgba(255,255,255,0.35) 1px,transparent 1px),
    linear-gradient(180deg,#5bb8f5 0%,#a8d8f0 55%,#c8eac0 75%,#5ab552 100%);
  background-size:28px 28px,100% 100%;}
body::before{content:'';position:fixed;top:-140px;right:-140px;width:380px;height:380px;border-radius:50%;border:42px solid rgba(255,255,255,0.18);pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;top:48px;right:-140px;width:380px;height:24px;background:rgba(255,255,255,0.18);pointer-events:none;z-index:0;}
.cloud{position:fixed;border-radius:50px;background:rgba(255,255,255,0.55);pointer-events:none;z-index:0;animation:drift linear infinite;}
.cloud::before,.cloud::after{content:'';position:absolute;background:rgba(255,255,255,0.55);border-radius:50%;}
.cloud-1{width:100px;height:30px;top:6%;left:-120px;animation-duration:40s;animation-delay:-8s;}
.cloud-1::before{width:50px;height:44px;top:-22px;left:14px;}
.cloud-1::after{width:36px;height:36px;top:-16px;left:44px;}
.cloud-2{width:70px;height:22px;top:15%;left:-90px;animation-duration:55s;animation-delay:-25s;}
.cloud-2::before{width:36px;height:32px;top:-16px;left:10px;}
.cloud-2::after{width:28px;height:28px;top:-12px;left:32px;}
@keyframes drift{from{transform:translateX(0);}to{transform:translateX(calc(100vw + 200px));}}
input::placeholder{color:#a0b8cc}
select option{background:#e8f4ff;color:#1a2a3a}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:#f0f7ff;border-radius:4px}
::-webkit-scrollbar-thumb{background:#a8d8f0;border-radius:4px}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}
input[type=number]::-webkit-inner-spin-button{opacity:0.4}
.sug-item:hover{background:rgba(91,184,245,0.15)!important}
.move-item:hover{background:rgba(91,184,245,0.1)!important}
</style>

// ══════════════════════════════════════════════════════
// 計算ロジック
// ══════════════════════════════════════════════════════
const LV=50;
function calcStat(base,ev,iv,natM){return Math.floor((Math.floor(base*2+iv+Math.floor(ev/4))*LV/100+5)*natM);}
function calcHP(base,ev,iv){return Math.floor((base*2+iv+Math.floor(ev/4))*LV/100)+LV+10;}

function calcDmg(atkS,defS,power,stabM,typeM,itemM,weatherM,terrainM,screenM,critM,burnM,otherM){
  if(!power||typeM===0)return{min:0,max:0};
  const base=Math.floor(Math.floor(Math.floor(2*LV/5+2)*power*atkS/defS)/50)+2;
  const mod=stabM*typeM*itemM*weatherM*terrainM*screenM*critM*burnM*otherM;
  const max=Math.floor(base*mod);
  const min=Math.floor(base*mod*0.85);
  return{min,max};
}

const POKE_CACHE={};
const MOVE_API_CACHE={};
async function fetchPoke(jaName){
  if(POKE_CACHE[jaName])return POKE_CACHE[jaName];
  const en=NAME_MAP[jaName]||jaName.toLowerCase().replace(/\s/g,'-');
  const r=await fetch(`https://pokeapi.co/api/v2/pokemon/${en}`);
  if(!r.ok)throw new Error(`"${jaName}" が見つかりません`);
  const d=await r.json();
  const res={
    jaName,sprite:d.sprites?.front_default,
    types:d.types.map(t=>t.type.name),
    stats:{hp:d.stats[0].base_stat,atk:d.stats[1].base_stat,def:d.stats[2].base_stat,spa:d.stats[3].base_stat,spd:d.stats[4].base_stat,spe:d.stats[5].base_stat},
    moveNames:d.moves.map(m=>m.move.name)
  };
  POKE_CACHE[jaName]=res;return res;
}
async function fetchMovesAll(names,onProg){
  const BATCH=20;const results=[];
  for(let i=0;i<names.length;i+=BATCH){
    const batch=names.slice(i,i+BATCH);
    const rs=await Promise.all(batch.map(async n=>{
      if(MOVE_API_CACHE[n])return MOVE_API_CACHE[n];
      try{
        const r=await fetch(`https://pokeapi.co/api/v2/move/${n}`);
        if(!r.ok)return null;
        const d=await r.json();
        const ja=d.names.find(x=>x.language.name==='ja-Hrkt')?.name||d.names.find(x=>x.language.name==='ja')?.name||n;
        const res={name:n,ja,power:d.power,type:d.type.name,cat:d.damage_class.name,pp:d.pp};
        MOVE_API_CACHE[n]=res;return res;
      }catch{return null;}
    }));
    results.push(...rs.filter(Boolean));
    onProg(Math.min(i+BATCH,names.length),names.length);
    if(i+BATCH<names.length)await new Promise(r=>setTimeout(r,60));
  }
  return results;
}

// ══════════════════════════════════════════════════════
// ダメージ計算タブ
// ══════════════════════════════════════════════════════
const DEF_EVS=()=>({hp:0,atk:0,def:0,spa:0,spd:0,spe:0});
const DEF_IVS=()=>({hp:31,atk:31,def:31,spa:31,spd:31,spe:31});
const DEF_NATS=()=>({hp:"1.0",atk:"1.0",def:"1.0",spa:"1.0",spd:"1.0",spe:"1.0"});

function DamageCalc({champions}){
  const [atkPoke,setAtkPoke]=useState(null);
  const [atkLoading,setAtkLoading]=useState(false);
  const [atkProg,setAtkProg]=useState(null);
  const [atkEvs,setAtkEvs]=useState(DEF_EVS());
  const [atkIvs,setAtkIvs]=useState(DEF_IVS());
  const [atkNats,setAtkNats]=useState(DEF_NATS());
  const [atkItem,setAtkItem]=useState("なし");
  const [atkAbility,setAtkAbility]=useState("");
  const [atkBurn,setAtkBurn]=useState(false);

  const [defPoke,setDefPoke]=useState(null);
  const [defLoading,setDefLoading]=useState(false);
  const [defProg,setDefProg]=useState(null);
  const [defEvs,setDefEvs]=useState(DEF_EVS());
  const [defIvs,setDefIvs]=useState(DEF_IVS());
  const [defNats,setDefNats]=useState(DEF_NATS());
  const [defItem,setDefItem]=useState("なし");
  const [defAbility,setDefAbility]=useState("");
  const [defBurn,setDefBurn]=useState(false);

  // フィールド条件
  const [weather,setWeather]=useState("なし");
  const [terrain,setTerrain]=useState("なし");
  const [atkScreen,setAtkScreen]=useState("なし");
  const [crit,setCrit]=useState(false);

  // 技フィルター
  const [filter,setFilter]=useState("damage");
  const [sortKey,setSortKey]=useState("max");
  const [moveSrc,setMoveSrc]=useState("api"); // api or manual
  const [manualPow,setManualPow]=useState(90);
  const [manualType,setManualType]=useState("ノーマル");
  const [manualCat,setManualCat]=useState("p");
  const [manualName,setManualName]=useState("");

  // 天気倍率
  function weatherMult(typeJA){
    const en=TYPE_JA_EN[typeJA];
    if(weather==="晴れ"){if(en==="fire")return 1.5;if(en==="water")return 0.5;}
    if(weather==="雨"){if(en==="water")return 1.5;if(en==="fire")return 0.5;}
    if(weather==="すなあらし"){if(en==="rock"||en==="ground"||en==="steel")return 1;}
    if(weather==="ゆき"){if(en==="ice")return 1;}
    return 1;
  }
  // テレイン倍率
  function terrainMult(typeJA){
    const en=TYPE_JA_EN[typeJA];
    if(terrain==="エレキフィールド"&&en==="electric")return 1.3;
    if(terrain==="グラスフィールド"&&en==="grass")return 1.3;
    if(terrain==="サイコフィールド"&&en==="psychic")return 1.3;
    if(terrain==="ミストフィールド"&&en==="dragon")return 0.5;
    return 1;
  }

  // 計算
  const results=useMemo(()=>{
    if(!atkPoke||!defPoke)return null;
    const atkDefTypes=defPoke.types;
    const defHP=calcHP(defPoke.stats.hp,defEvs.hp,defIvs.hp);
    const defDef=Math.floor(calcStat(defPoke.stats.def,defEvs.def,defIvs.def,parseFloat(defNats.def))*(defItem==="しんかのきせき"?1.5:defItem==="とつげきチョッキ"?1:1));
    const defSpd=Math.floor(calcStat(defPoke.stats.spd,defEvs.spd,defIvs.spd,parseFloat(defNats.spd))*(defItem==="しんかのきせき"?1.5:defItem==="とつげきチョッキ"?1.5:1));
    const atkAtk=calcStat(atkPoke.stats.atk,atkEvs.atk,atkIvs.atk,parseFloat(atkNats.atk));
    const atkSpa=calcStat(atkPoke.stats.spa,atkEvs.spa,atkIvs.spa,parseFloat(atkNats.spa));

    let movesToCalc=[];
    if(moveSrc==="manual"){
      movesToCalc=[{name:"manual",ja:manualName||"手動入力",power:manualPow,type:TYPE_JA_EN[manualType]||"normal",cat:manualCat==="p"?"physical":manualCat==="s"?"special":"status",pp:0}];
    } else {
      movesToCalc=atkPoke.moves||[];
    }

    return movesToCalc.map(mv=>{
      const typeJA=TYPE_EN_JA[mv.type]||"ノーマル";
      const isPhy=mv.cat==="physical"||mv.cat==="p";
      const isSpe=mv.cat==="special"||mv.cat==="s";
      const isStat=mv.cat==="status"||mv.cat==="t";
      if(isStat||!mv.power)return{mv,res:null,defHP};
      const atkS=isPhy?atkAtk:atkSpa;
      const defS=isPhy?defDef:defSpd;
      const stab=atkPoke.types.includes(mv.type);
      const tMult=typeMult(mv.type,atkDefTypes);
      if(tMult===0)return{mv,res:{tMult:0,min:0,max:0,minP:"0",maxP:"0",stab,ko:Infinity},defHP};
      // 持ち物倍率
      let itemM=1;
      const iD=ITEM_DB[atkItem]||ITEM_DB["なし"];
      if(iD.phyOnly&&isPhy)itemM=1.5;
      else if(iD.speOnly&&isSpe)itemM=1.5;
      else if(iD.atkM!==1&&!iD.phyOnly&&!iD.speOnly)itemM=iD.atkM;
      if(iD.expertBelt&&tMult>1)itemM=Math.max(itemM,1.2);
      if(iD.typeBoost&&iD.typeBoost===typeJA)itemM=Math.max(itemM,1.2);
      // やけど
      const burnM=(atkBurn&&isPhy)?0.5:1;
      // スクリーン
      let screenM=1;
      if(atkScreen==="リフレクター"&&isPhy)screenM=0.5;
      if(atkScreen==="ひかりのかべ"&&isSpe)screenM=0.5;
      if(atkScreen==="オーロラベール")screenM=0.5;
      const wM=weatherMult(typeJA);
      const trnM=terrainMult(typeJA);
      const critM=crit?1.5:1;
      const {min,max}=calcDmg(atkS,defS,mv.power,stab?1.5:1,tMult,itemM,wM,trnM,screenM,critM,burnM,1);
      const minP=(min/defHP*100).toFixed(1);
      const maxP=(max/defHP*100).toFixed(1);
      const ko=max>0?Math.ceil(defHP/max):Infinity;
      return{mv,res:{tMult,min,max,minP,maxP,stab,ko,atkS,defS},defHP};
    });

        e('button',{onClick:()=>setMoveSrc("manual"),style:{flex:1,padding:"6px",borderRadius:"8px",border:`2px solid ${moveSrc==="manual"?"rgba(227,53,13,0.3)":"#d4e8f5"}`,fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:moveSrc==="manual"?"rgba(227,53,13,0.08)":"#f0f7ff",color:moveSrc==="manual"?RED:MUTED}},"✏️ 手動入力")

        e('div',null,e('span',{style:lbl},"技名（任意）"),e('input',{style:inp,value:manualName,onChange:v=>setManualName(v.target.value),placeholder:"技名"})),
        e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"6px"}},
          e('div',null,e('span',{style:lbl},"威力"),e('input',{type:"number",min:1,max:300,value:manualPow,onChange:v=>setManualPow(+v.target.value||0),style:{...inp,textAlign:"center"}})),

        )
      )
    ),

    // 結果
    results&&e('div',null,

        e('div',{style:{display:"flex",gap:"4px",flexWrap:"wrap",marginBottom:"6px"}},

          )

          [["max","ダメージ↓"],["power","威力↓"],["type","相性↓"]].map(([k,l])=>
            e('button',{key:k,onClick:()=>setSortKey(k),
              style:{padding:"4px 7px",borderRadius:"6px",border:`2px solid ${sortKey===k?"rgba(227,53,13,0.3)":"#d4e8f5"}`,fontWeight:"700",fontSize:"10px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:sortKey===k?"rgba(227,53,13,0.08)":"#f0f7ff",color:sortKey===k?RED:MUTED}},l)

      e('div',{style:{fontSize:"10px",color:MUTED,fontWeight:"700",textAlign:"right",marginBottom:"4px"}},`${displayed.length}件`),
      ...displayed.map(({mv,res,defHP})=>{
        const typeJA=TYPE_EN_JA[mv.type]||"ノーマル";
        const pct=res?parseFloat(res.maxP):0;
        const ko=res?.ko;
        const tMult=res?.tMult||1;
        const tMultColor=tMult>=4?"#c03030":tMult>=2?"#e07020":tMult===0?"#aaa":tMult<1?"#1a6fa8":TEXT;
        return e('div',{key:mv.name,style:{background:"rgba(255,255,255,0.88)",borderRadius:"10px",padding:"8px 10px",marginBottom:"4px",border:"2px solid #e8f4ff",animation:"fadeIn 0.1s"}},
          // 1行目
          e('div',{style:{display:"flex",alignItems:"center",gap:"4px",marginBottom:"3px",flexWrap:"wrap"}},

            !res&&e('span',{style:{fontSize:"10px",color:MUTED,fontWeight:"600"}},"変化わざ"),

let spId=1;
function SpeedCalc({champions}){
  const maxEv=champions?32:252;
  const [mons,setMons]=useState([
    {id:spId++,name:"",base:100,ev:0,iv:31,nat:"1.0",item:"なし",tw:false,para:false},
    {id:spId++,name:"",base:80,ev:0,iv:31,nat:"1.0",item:"なし",tw:false,para:false},
  ]);
  const [trickRoom,setTrickRoom]=useState(false);
  const [loadingId,setLoadingId]=useState(null);

  const calcSpd=(m)=>{
    let s=calcStat(m.base,m.ev,m.iv,parseFloat(m.nat));
    const itm=ITEM_DB[m.item]||ITEM_DB["なし"];
    s=Math.floor(s*itm.spdM);
    if(m.tw)s*=2;
    if(m.para)s=Math.floor(s*0.5);
    return s;
  };

  const upd=(id,f,v)=>setMons(p=>p.map(m=>m.id===id?{...m,[f]:v}:m));

  const loadPoke=async(id,name)=>{
    setLoadingId(id);
    try{
      const p=await fetchPoke(name);
      setMons(prev=>prev.map(m=>m.id===id?{...m,name,base:p.stats.spe}:m));
    }catch(err){alert(err.message);}
    setLoadingId(null);
  };

  const sorted=useMemo(()=>{
    const arr=mons.map(m=>({...m,spd:calcSpd(m)}));
    return trickRoom?[...arr].sort((a,b)=>a.spd-b.spd):[...arr].sort((a,b)=>b.spd-a.spd);
  },[mons,trickRoom]);

  const maxSpd=sorted[0]?.spd||1;
  const SPEED_ITEMS=["なし","こだわりスカーフ","くろいてっきゅう","きょうせいギプス"];

  return e('div',{style:{display:"flex",flexDirection:"column",gap:"10px"}},
    // トリックルーム
    e('div',{style:{...card,padding:"10px"}},
      e('button',{onClick:()=>setTrickRoom(!trickRoom),
        style:{width:"100%",padding:"8px",borderRadius:"8px",border:`2px solid ${trickRoom?"rgba(112,56,248,0.4)":"#d4e8f5"}`,fontWeight:"800",fontSize:"12px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:trickRoom?"rgba(112,56,248,0.08)":"#f0f7ff",color:trickRoom?"#7038F8":MUTED}
      },trickRoom?"🔄 トリックルーム中（遅い順）":"トリックルームなし（速い順）")
    ),

    // ポケモン入力
    ...mons.map((m,idx)=>e('div',{key:m.id,style:{...card,borderColor:idx===0?"rgba(227,53,13,0.15)":"rgba(91,184,245,0.2)"}},
      e('div',{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"8px"}},
        e('div',{style:{width:"24px",height:"24px",borderRadius:"50%",background:idx===0?"rgba(227,53,13,0.1)":"rgba(91,184,245,0.1)",border:`2px solid ${idx===0?"rgba(227,53,13,0.3)":"rgba(91,184,245,0.3)"}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:"11px",fontWeight:"900",color:idx===0?RED:BLUE,flexShrink:0}},idx+1),
        e('input',{style:{...inp,flex:1},value:m.name,placeholder:"ポケモン名（入力してEnter）",
          onChange:v=>upd(m.id,"name",v.target.value),
          onKeyDown:ev=>{if(ev.key==='Enter'&&m.name)loadPoke(m.id,m.name);}}),
        e('button',{onClick:()=>m.name&&loadPoke(m.id,m.name),
          style:{padding:"5px 8px",borderRadius:"7px",border:"2px solid #d4e8f5",fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:"#f0f7ff",color:MUTED,flexShrink:0}
        },loadingId===m.id?"...":"検索"),
        mons.length>2&&e('button',{onClick:()=>setMons(p=>p.filter(x=>x.id!==m.id)),
          style:{padding:"5px 8px",borderRadius:"7px",border:"2px solid rgba(200,50,50,0.2)",fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:"rgba(220,50,50,0.06)",color:"#c03030",flexShrink:0}
        },"✕")
      ),
      e('div',{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"5px",marginBottom:"6px"}},
        e('div',null,e('span',{style:lbl},"種族値(素早さ)"),e('input',{type:"number",min:1,max:300,value:m.base,onChange:v=>upd(m.id,"base",+v.target.value||0),style:{...inp,textAlign:"center"}})),
        e('div',null,e('span',{style:lbl},`努力値(0〜${maxEv})`),e('input',{type:"number",min:0,max:maxEv,value:m.ev,onChange:v=>upd(m.id,"ev",Math.max(0,Math.min(maxEv,+v.target.value||0))),style:{...inp,textAlign:"center"}})),
        e('div',null,e('span',{style:lbl},"個体値"),e('input',{type:"number",min:0,max:31,value:m.iv,onChange:v=>upd(m.id,"iv",Math.max(0,Math.min(31,+v.target.value||0))),style:{...inp,textAlign:"center"}})),
        e('div',null,e('span',{style:lbl},"性格"),e('select',{value:m.nat,onChange:v=>upd(m.id,"nat",v.target.value),style:{...inp,appearance:"none",textAlign:"center"}},e('option',{value:"1.1"},"+"),e('option',{value:"1.0"},"±"),e('option',{value:"0.9"},"-")))
      ),
      e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"5px"}},
        e('div',null,e('span',{style:lbl},"持ち物"),e('select',{value:m.item,onChange:v=>upd(m.id,"item",v.target.value),style:{...inp,appearance:"none",fontSize:"10px"}},
          SPEED_ITEMS.map(i=>e('option',{key:i,value:i},i+(i==="こだわりスカーフ"?" (×1.5)":i==="くろいてっきゅう"?" (×0.5)":i==="きょうせいギプス"?" (×0.5)":""))))),
        e('div',null,e('span',{style:lbl},"状態"),e('button',{onClick:()=>upd(m.id,"para",!m.para),style:{width:"100%",padding:"5px",borderRadius:"7px",border:`2px solid ${m.para?"rgba(248,208,48,0.5)":"#d4e8f5"}`,fontWeight:"700",fontSize:"10px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:m.para?"rgba(248,208,48,0.1)":"#f0f7ff",color:m.para?"#c08000":MUTED}},m.para?"⚡まひ中":"まひなし")),
        e('div',null,e('span',{style:lbl},"おいかぜ"),e('button',{onClick:()=>upd(m.id,"tw",!m.tw),style:{width:"100%",padding:"5px",borderRadius:"7px",border:`2px solid ${m.tw?"rgba(91,184,245,0.4)":"#d4e8f5"}`,fontWeight:"700",fontSize:"10px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:m.tw?"rgba(91,184,245,0.1)":"#f0f7ff",color:m.tw?BLUE:MUTED}},m.tw?"🌬️中":"なし"))
      )
    )),

    mons.length<6&&e('button',{onClick:()=>setMons(p=>[...p,{id:spId++,name:"",base:80,ev:0,iv:31,nat:"1.0",item:"なし",tw:false,para:false}]),
      style:{padding:"10px",borderRadius:"10px",border:"2px solid rgba(91,184,245,0.3)",fontWeight:"800",fontSize:"12px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:"rgba(91,184,245,0.05)",color:BLUE,width:"100%"}
    },`＋ ポケモンを追加 (${mons.length}/6)`),

    // 結果ランキング
    e('div',{style:{...card,borderColor:"rgba(91,184,245,0.3)"}},
      e('div',{style:{fontWeight:"900",fontSize:"13px",color:BLUE,marginBottom:"12px"}},"⚡ "+(trickRoom?"トリックルーム中の行動順":"すばやさランキング")),
      sorted.map((m,rank)=>{
        const bar=(m.spd/maxSpd*100).toFixed(1);
        const diff=rank>0?m.spd-sorted[0].spd:0;
        const rankColors=["#ffd700","#c0c0c0","#cd7f32"];
        return e('div',{key:m.id,style:{marginBottom:"10px",animation:"fadeIn 0.2s"}},
          e('div',{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"3px"}},
            e('div',{style:{display:"flex",alignItems:"center",gap:"7px"}},
              e('div',{style:{width:"22px",height:"22px",borderRadius:"50%",background:rank<3?rankColors[rank]:"#e8f4ff",border:rank<3?"2px solid rgba(0,0,0,0.1)":"2px solid #d4e8f5",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",fontWeight:"900",color:rank<3?"#333":MUTED,flexShrink:0}},rank+1),
              e('span',{style:{fontSize:"13px",fontWeight:"800",color:TEXT}},m.name||`ポケモン${rank+1}`)
            ),
            e('div',{style:{textAlign:"right",display:"flex",alignItems:"center",gap:"6px"}},
              rank>0&&e('span',{style:{fontSize:"10px",color:"#c03030",fontWeight:"800"}},diff),
              e('span',{style:{fontSize:"18px",fontWeight:"900",color:rank===0?RED:BLUE}},m.spd)
            )
          ),
          e('div',{style:{background:"#e8f4ff",borderRadius:"6px",height:"10px",overflow:"hidden"}},
            e('div',{style:{width:`${bar}%`,height:"100%",borderRadius:"6px",
              background:rank===0?"linear-gradient(90deg,#e3350d,#f08030)":rank===1?"linear-gradient(90deg,#5bb8f5,#a8d8f0)":"linear-gradient(90deg,#a8d8f0,#c8eac0)"}})
          )
        );
      }),
      sorted.length>=2&&e('div',{style:{marginTop:"10px",background:sorted[0].spd===sorted[1].spd?"rgba(248,208,48,0.08)":trickRoom?"rgba(112,56,248,0.06)":"rgba(90,181,82,0.06)",border:`2px solid ${sorted[0].spd===sorted[1].spd?"rgba(248,208,48,0.3)":trickRoom?"rgba(112,56,248,0.2)":"rgba(90,181,82,0.25)"}`,borderRadius:"10px",padding:"8px 12px",textAlign:"center"}},
        sorted[0].spd===sorted[1].spd
          ?e('span',{style:{fontWeight:"800",color:"#c08000"}},"⚡ 同速！乱数で行動順決定")
          :e('span',{style:{fontWeight:"800",color:TEXT}},
              e('span',{style:{color:RED,fontWeight:"900"}},sorted[0].name||"1位"),
              ` が先手（差: ${sorted[0].spd-sorted[1].spd}）`)
      )
    )
  );
}

        e('div',{style:{position:"absolute",top:"-30px",right:"-30px",width:"100px",height:"100px",borderRadius:"50%",border:"16px solid rgba(255,255,255,0.12)",pointerEvents:"none"}}),
        e('div',{style:{display:"flex",alignItems:"center",gap:"10px",marginBottom:"10px",position:"relative"}},
          e('a',{href:"./",style:{display:"flex",alignItems:"center",justifyContent:"center",width:"30px",height:"30px",borderRadius:"50%",background:"rgba(255,255,255,0.2)",color:"#fff",textDecoration:"none",fontSize:"16px",flexShrink:0,fontWeight:"700"}},"‹"),
          e('div',{style:{width:"32px",height:"32px",borderRadius:"50%",background:"linear-gradient(180deg,#fff 50%,#333 50%)",border:"2px solid #333",flexShrink:0,position:"relative",boxShadow:"0 2px 6px rgba(0,0,0,0.3)"}},
            e('div',{style:{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:"9px",height:"9px",borderRadius:"50%",background:"#fff",border:"2px solid #333"}})
          ),
          e('div',null,
            e('div',{style:{fontSize:"15px",fontWeight:"900",color:"#fff"}},tab==="damage"?"💥 ダメージ計算":"⚡ すばやさ比較"),
            e('div',{style:{fontSize:"10px",color:"rgba(255,255,255,0.75)",fontWeight:"600"}},"PokéChampions 計算ツール")
          ),
          // Champions/通常切り替え
          e('button',{onClick:()=>setChampions(!champions),
            style:{marginLeft:"auto",padding:"4px 8px",borderRadius:"6px",border:"2px solid rgba(255,255,255,0.3)",fontWeight:"800",fontSize:"10px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:"rgba(255,255,255,0.15)",color:"#fff",flexShrink:0}
          },champions?"Champions":"通常")
        ),
        // EV表示
        e('div',{style:{fontSize:"9px",color:"rgba(255,255,255,0.6)",fontWeight:"700",marginBottom:"6px",textAlign:"right"}},
          champions?"EV上限: 各32 / 合計66":"EV上限: 各252 / 合計510"
        ),
        e('div',{style:{display:"flex",gap:"5px"}},
          [["damage","💥 ダメージ"],["speed","⚡ すばやさ"]].map(([k,l])=>
            e('button',{key:k,onClick:()=>setTab(k),
              style:{flex:1,padding:"7px 4px",background:tab===k?"rgba(255,255,255,0.95)":"rgba(255,255,255,0.15)",border:"none",borderRadius:"9px",color:tab===k?RED:"rgba(255,255,255,0.85)",fontWeight:"700",fontSize:"12px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",boxShadow:tab===k?"0 2px 6px rgba(0,0,0,0.15)":"none"}},l)
          )
        )
      ),
      // コンテンツ
      e('div',{style:{flex:1,overflow:"auto",padding:"14px",paddingBottom:"24px"}},
        tab==="damage"?e(DamageCalc,{champions}):e(SpeedCalc,{champions})
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
