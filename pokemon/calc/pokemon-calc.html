// ═══════════════════════════════════════
const LV=50;
function calcStat(b,ev,iv,n){return Math.floor((Math.floor(b*2+iv+Math.floor(ev/4))*LV/100+5)*n);}
function calcHP(b,ev,iv){return Math.floor((b*2+iv+Math.floor(ev/4))*LV/100)+LV+10;}
function rankMul(r){return r>=0?(2+r)/2:2/(2-r);}
function calcDmg(atkS,defS,pow,stabM,typeM,itemM,wM,trnM,scrM,critM,burnM){
  if(!pow||typeM===0)return{min:0,max:0};
  const base=Math.floor(Math.floor(Math.floor(2*LV/5+2)*pow*atkS/defS)/50)+2;
  const mod=stabM*typeM*itemM*wM*trnM*scrM*critM*burnM;
  return{min:Math.floor(base*mod*0.85),max:Math.floor(base*mod)};
}

    if(!en||en.length===0)en=cleaned.toLowerCase().replace(/\s/g,'-');
  }
  const r=await fetch(`https://pokeapi.co/api/v2/pokemon/${en}`);
  if(!r.ok)throw new Error(`"${ja}" が見つかりません（API: ${en}）`);
  const d=await r.json();
  const res={ja,sprite:d.sprites?.front_default,types:d.types.map(t=>t.type.name),
    stats:{hp:d.stats[0].base_stat,atk:d.stats[1].base_stat,def:d.stats[2].base_stat,spa:d.stats[3].base_stat,spd:d.stats[4].base_stat,spe:d.stats[5].base_stat},
    moveNames:d.moves.map(m=>m.move.name)};
  PC[ja]=res;return res;
}
async function fetchMoves(names,onP){
  const BATCH=20;const results=[];
  for(let i=0;i<names.length;i+=BATCH){
    const b=names.slice(i,i+BATCH);
    const rs=await Promise.all(b.map(async n=>{
      if(MC[n])return MC[n];
      try{const r=await fetch(`https://pokeapi.co/api/v2/move/${n}`);if(!r.ok)return null;
        const d=await r.json();
        const ja=d.names.find(x=>x.language.name==='ja-Hrkt')?.name||d.names.find(x=>x.language.name==='ja')?.name||n;
        const res={name:n,ja,power:d.power,type:d.type.name,cat:d.damage_class.name,pp:d.pp};
        MC[n]=res;return res;}catch{return null;}
    }));
    results.push(...rs.filter(Boolean));
    onP(Math.min(i+BATCH,names.length),names.length);
    if(i+BATCH<names.length)await new Promise(r=>setTimeout(r,60));
  }
  return results;
}

// ═══════════════════════════════════════
// ダメージ計算
// ═══════════════════════════════════════
const DE=()=>({hp:0,atk:0,def:0,spa:0,spd:0,spe:0});
const DN=()=>({hp:"1.0",atk:"1.0",def:"1.0",spa:"1.0",spd:"1.0",spe:"1.0"});
const DR=()=>({hp:0,atk:0,def:0,spa:0,spd:0,spe:0});
function DamageCalc({champions}){
  const [aP,setAP]=useState(null);const [aL,setAL]=useState(false);const [aPr,setAPr]=useState(null);
  const [aEv,setAEv]=useState(DE());const [aN,setAN]=useState(DN());const [aR,setAR]=useState(DR());
  const [aItem,setAItem]=useState("なし");const [aAb,setAAb]=useState("なし");const [aBurn,setABurn]=useState(false);
  const [dP,setDP]=useState(null);const [dL,setDL]=useState(false);const [dPr,setDPr]=useState(null);
  const [dEv,setDEv]=useState(DE());const [dN,setDN]=useState(DN());const [dR,setDR]=useState(DR());
  const [dItem,setDItem]=useState("なし");const [dAb,setDAb]=useState("なし");const [dBurn,setDBurn]=useState(false);
  const [weather,setWeather]=useState("なし");
  const [terrain,setTerrain]=useState("なし");
  const [screen,setScreen]=useState("なし");
  const [crit,setCrit]=useState(false);
  const [filter,setFilter]=useState("damage");
  const [sortKey,setSortKey]=useState("max");
  const [moveSrc,setMoveSrc]=useState("api");
  const [mPow,setMPow]=useState(90);const [mType,setMType]=useState("ノーマル");const [mCat,setMCat]=useState("p");const [mName,setMName]=useState("");

  function wMul(tja){const en=TJE[tja];if(weather==="晴れ"){if(en==="fire")return 1.5;if(en==="water")return 0.5;}if(weather==="雨"){if(en==="water")return 1.5;if(en==="fire")return 0.5;}return 1;}
  function trnMul(tja){const en=TJE[tja];if(terrain==="エレキフィールド"&&en==="electric")return 1.3;if(terrain==="グラスフィールド"&&en==="grass")return 1.3;if(terrain==="サイコフィールド"&&en==="psychic")return 1.3;if(terrain==="ミストフィールド"&&en==="dragon")return 0.5;return 1;}

  const results=useMemo(()=>{
    if(!aP||!dP)return null;
    const iv=31;
    const atkAtk=Math.floor(calcStat(aP.stats.atk,aEv.atk,iv,parseFloat(aN.atk))*rankMul(aR.atk)*(IDB[aItem]?.am||1));
    const atkSpa=Math.floor(calcStat(aP.stats.spa,aEv.spa,iv,parseFloat(aN.spa))*rankMul(aR.spa)*(IDB[aItem]?.am||1));
    const defDef=Math.floor(calcStat(dP.stats.def,dEv.def,iv,parseFloat(dN.def))*rankMul(dR.def)*(IDB[dItem]?.dm||1));
    const defSpd=Math.floor(calcStat(dP.stats.spd,dEv.spd,iv,parseFloat(dN.spd))*rankMul(dR.spd)*(IDB[dItem]?.dm||1));
    const defHP=calcHP(dP.stats.hp,dEv.hp,iv);
    let movesToCalc=moveSrc==="manual"
      ?[{name:"m",ja:mName||"手動入力",power:mPow,type:TJE[mType]||"normal",cat:mCat==="p"?"physical":mCat==="s"?"special":"status"}]
      :(aP.moves||[]);

    return movesToCalc.map(mv=>{
      const tja=TEJ[mv.type]||"ノーマル";
      const isPhy=mv.cat==="physical"||mv.cat==="p";
      const isSpe=mv.cat==="special"||mv.cat==="s";
      if((mv.cat==="status"||mv.cat==="t")||!mv.power)return{mv,res:null,defHP};
      const atkS=isPhy?atkAtk:atkSpa;
      const defS=isPhy?defDef:defSpd;
      const stab=aP.types.includes(mv.type);
      const tm=tMult(mv.type,dP.types);
      if(tm===0)return{mv,res:{tm:0,min:0,max:0,minP:"0",maxP:"0",stab,ko:Infinity},defHP};
      // 持ち物
      const id=IDB[aItem]||IDB["なし"];
      let itemM=1;
      if(id.phy&&isPhy)itemM=1.5;
      else if(id.spe&&isSpe)itemM=1.5;
      else if(id.am>1&&!id.phy&&!id.spe)itemM=id.am;
      if(id.expert&&tm>1)itemM=Math.max(itemM,1.2);
      const burnM=(aBurn&&isPhy)?0.5:1;
      let scrM=1;
      if(screen==="リフレクター"&&isPhy)scrM=0.5;
      if(screen==="ひかりのかべ"&&isSpe)scrM=0.5;
      if(screen==="オーロラベール")scrM=0.5;
      const critM=crit?1.5:1;
      const {min,max}=calcDmg(atkS,defS,mv.power,stab?1.5:1,tm,itemM,wMul(tja),trnMul(tja),scrM,1,burnM);
      const {min:cMin,max:cMax}=calcDmg(atkS,defS,mv.power,stab?1.5:1,tm,itemM,wMul(tja),trnMul(tja),1,1.5,burnM);
      const minP=(min/defHP*100).toFixed(1);const maxP=(max/defHP*100).toFixed(1);
      const ko=max>0?Math.ceil(defHP/max):Infinity;
      const cko=cMax>0?Math.ceil(defHP/cMax):Infinity;
      return{mv,res:{tm,min,max,minP,maxP,stab,ko,cMin,cMax,cMinP:(cMin/defHP*100).toFixed(1),cMaxP:(cMax/defHP*100).toFixed(1),cko},defHP};
    });
  },[aP,dP,aEv,aN,aR,aItem,aBurn,dEv,dN,dR,dItem,weather,terrain,screen,crit,moveSrc,mPow,mType,mCat,mName]);

  const displayed=useMemo(()=>{
    if(!results)return[];
    let rows=results;
    if(filter==="damage")rows=rows.filter(r=>r.res&&r.res.tm>0);
    else if(filter==="phy")rows=rows.filter(r=>(r.mv.cat==="physical"||r.mv.cat==="p")&&r.res&&r.res.tm>0);
    else if(filter==="spe")rows=rows.filter(r=>(r.mv.cat==="special"||r.mv.cat==="s")&&r.res&&r.res.tm>0);
    else if(filter==="sta")rows=rows.filter(r=>r.mv.cat==="status"||r.mv.cat==="t");
    if(sortKey==="max")rows=[...rows].sort((a,b)=>(b.res?.max||0)-(a.res?.max||0));
    else if(sortKey==="pow")rows=[...rows].sort((a,b)=>(b.mv.power||0)-(a.mv.power||0));
    else if(sortKey==="typ")rows=[...rows].sort((a,b)=>(b.res?.tm||0)-(a.res?.tm||0));
    return rows;
  },[results,filter,sortKey]);

  const g2={display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px"};

let spId=1;
function SpeedCalc({champions}){
  const maxEv=champions?32:252;
  const [mons,setMons]=useState([
    {id:spId++,name:"",base:100,ev:0,nat:"1.0",item:"なし",tw:false,para:false},
    {id:spId++,name:"",base:80,ev:0,nat:"1.0",item:"なし",tw:false,para:false},
  ]);
  const [trick,setTrick]=useState(false);
  const [lid,setLid]=useState(null);
  const iv=31;
  const calcS=(m,ev_,nat_,item_=m.item,tw_=m.tw,para_=m.para)=>{
    let s=calcStat(m.base,ev_,iv,parseFloat(nat_));
    const id=IDB[item_]||IDB["なし"];
    s=Math.floor(s*id.sm);
    if(tw_)s*=2;if(para_)s=Math.floor(s*0.5);return s;
  };
  // ベンチマーク
  const bench=(m)=>{
    const maxE=champions?32:252;
    return{saikou:calcS(m,maxE,"1.1"),jyunsoku:calcS(m,0,"1.1"),musin:calcS(m,0,"1.0"),saitei:calcS(m,0,"0.9"),custom:calcS(m,m.ev,m.nat,m.item,m.tw,m.para)};
  };
  const upd=(id,f,v)=>setMons(p=>p.map(m=>m.id===id?{...m,[f]:v}:m));
  const loadP=async(id,name)=>{setLid(id);try{const p=await fetchPoke(name);setMons(pr=>pr.map(m=>m.id===id?{...m,name,base:p.stats.spe}:m));}catch(err){alert(err.message);}setLid(null);};

  const benches=mons.map(m=>({...m,...bench(m)}));
  // 全パターンをソート
  const allSpeeds=useMemo(()=>{
    const arr=[];
    benches.forEach((m,mi)=>{
      [{label:"最速",val:m.saikou},{label:"準速",val:m.jyunsoku},{label:"無振",val:m.musin},{label:"最遅",val:m.saitei}].forEach(({label,val})=>{
        arr.push({monIdx:mi,label,val,name:m.name||`${mi+1}`});
      });
    });
    return trick?arr.sort((a,b)=>a.val-b.val):arr.sort((a,b)=>b.val-a.val);
  },[benches,trick]);

  const colors=[RED,BLUE,"#2a8a20","#8a2060"];
  const SITEMS=["なし","こだわりスカーフ","くろいてっきゅう","きょうせいギプス"];

  return e('div',{style:{display:"flex",flexDirection:"column",gap:"10px"}},
    e('div',{style:{...card,padding:"10px"}},
      e('button',{onClick:()=>setTrick(!trick),style:{...tbtn(trick,"#7038F8","rgba(112,56,248,0.4)","rgba(112,56,248,0.08)"),width:"100%",padding:"8px"}},trick?"🔄 トリックルーム中（遅い順）":"トリックルームなし（速い順）")
    ),

    // ポケモン入力
    ...mons.map((m,idx)=>{
      const b=benches[idx];
      const col=colors[idx]||MUTED;
      return e('div',{key:m.id,style:{...card,borderColor:`${col}33`}},
        e('div',{style:{display:"flex",gap:"6px",alignItems:"center",marginBottom:"8px"}},
          e('div',{style:{fontSize:"11px",fontWeight:"900",background:col,color:"#fff",borderRadius:"6px",padding:"2px 8px",flexShrink:0}},idx+1),
          e('input',{style:{...inp,flex:1},value:m.name,placeholder:"ポケモン名（Enterで検索）",onChange:v=>upd(m.id,"name",v.target.value),onKeyDown:ev=>{if(ev.key==='Enter'&&m.name)loadP(m.id,m.name);}}),
          e('button',{onClick:()=>m.name&&loadP(m.id,m.name),style:{padding:"5px 8px",borderRadius:"7px",border:"2px solid #d4e8f5",fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:"#f0f7ff",color:MUTED,flexShrink:0}},lid===m.id?"...":"検索"),
          mons.length>2&&e('button',{onClick:()=>setMons(p=>p.filter(x=>x.id!==m.id)),style:{padding:"5px 8px",borderRadius:"7px",border:"2px solid rgba(200,50,50,0.2)",fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:"rgba(220,50,50,0.05)",color:"#c03030",flexShrink:0}},"✕")
        ),
        // 速度ベンチマーク表示
        e('div',{style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"4px",marginBottom:"8px"}},
          [{l:"最速",v:b.saikou},{l:"準速",v:b.jyunsoku},{l:"無振",v:b.musin},{l:"最遅",v:b.saitei}].map(({l,v})=>
            e('div',{key:l,style:{textAlign:"center",background:"rgba(248,252,255,0.9)",borderRadius:"8px",padding:"4px 2px",border:"1px solid #e8f4ff"}},
              e('div',{style:{fontSize:"9px",color:MUTED,fontWeight:"800",marginBottom:"2px"}},l),
              e('div',{style:{fontSize:"14px",fontWeight:"900",color:col}},v)
            )
          )
        ),
        // EV・性格・持ち物
        e('div',{style:{display:"flex",alignItems:"center",gap:"6px",marginBottom:"6px"}},
          e('span',{style:{fontSize:"9px",color:MUTED,fontWeight:"800",flexShrink:0}},"能力Pt"),
          champions
            ? e('button',{onClick:()=>upd(m.id,"ev",m.ev===0?32:0),style:{padding:"3px 12px",borderRadius:"7px",border:`2px solid ${m.ev===32?"rgba(227,53,13,0.4)":"#d4e8f5"}`,fontWeight:"900",fontSize:"12px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:m.ev===32?"rgba(227,53,13,0.08)":"#f0f7ff",color:m.ev===32?RED:MUTED}},m.ev===32?"32":"0")
            : e('div',{style:{display:"flex",gap:"4px",alignItems:"center",flex:1}},
                e('input',{type:"range",min:0,max:252,step:4,value:m.ev,onChange:v=>upd(m.id,"ev",+v.target.value),style:{flex:1,accentColor:col}}),
                e('span',{style:{fontSize:"11px",fontWeight:"800",color:TEXT,minWidth:"28px",textAlign:"center"}},m.ev)
              ),
          e('span',{style:{fontSize:"9px",color:MUTED,fontWeight:"800",flexShrink:0,marginLeft:"6px"}},"性格"),
          e('button',{onClick:()=>upd(m.id,"nat","0.9"),style:{...tbtn(m.nat==="0.9",BLUE),padding:"2px 6px"}},"−"),
          e('button',{onClick:()=>upd(m.id,"nat",m.nat==="1.0"?"1.1":m.nat==="1.1"?"0.9":"1.0"),style:{padding:"2px 8px",borderRadius:"6px",border:`2px solid ${m.nat!=="1.0"?`${col}44`:"#d4e8f5"}`,fontWeight:"900",fontSize:"11px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:m.nat!=="1.0"?`${col}11`:"#f0f7ff",color:m.nat==="1.1"?RED:m.nat==="0.9"?BLUE:TEXT}},m.nat==="1.1"?"↑":m.nat==="0.9"?"↓":"無"),
          e('button',{onClick:()=>upd(m.id,"nat","1.1"),style:{...tbtn(m.nat==="1.1",RED),padding:"2px 6px"}},"+")
        ),
        e('div',{style:{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"6px"}},
          e('div',null,e('span',{style:lbl},"持ち物"),e('select',{value:m.item,onChange:v=>upd(m.id,"item",v.target.value),style:{...inp,appearance:"none",fontSize:"11px"}},SITEMS.map(i=>e('option',{key:i,value:i},i)))),
          e('div',null,e('span',{style:lbl},"おいかぜ"),e('button',{onClick:()=>upd(m.id,"tw",!m.tw),style:{...tbtn(m.tw,BLUE,"rgba(91,184,245,0.4)","rgba(91,184,245,0.1)"),width:"100%",padding:"5px"}},m.tw?"🌬️中":"なし")),
          e('div',null,e('span',{style:lbl},"まひ"),e('button',{onClick:()=>upd(m.id,"para",!m.para),style:{...tbtn(m.para,"#c08000","rgba(248,208,48,0.5)","rgba(248,208,48,0.1)"),width:"100%",padding:"5px"}},m.para?"⚡中":"なし"))
        ),
        b.custom!==b.musin&&e('div',{style:{marginTop:"6px",textAlign:"center",fontSize:"11px",fontWeight:"800",color:col}},`カスタム: ${b.custom}`)
      );
    }),

    mons.length<6&&e('button',{onClick:()=>setMons(p=>[...p,{id:spId++,name:"",base:80,ev:0,nat:"1.0",item:"なし",tw:false,para:false}]),style:{...tbtn(false,BLUE,"rgba(91,184,245,0.3)","rgba(91,184,245,0.05)"),width:"100%",padding:"10px",fontWeight:"800",fontSize:"12px"}},`＋ ポケモンを追加 (${mons.length}/6)`),

    // 速度ランキング
    e('div',{style:{...card,borderColor:"rgba(91,184,245,0.3)"}},
      e('div',{style:{fontWeight:"900",fontSize:"13px",color:BLUE,marginBottom:"8px"}},"⚡ "+(trick?"トリックルーム行動順":"すばやさランキング")),
      allSpeeds.map((s,rank)=>{
        const col=colors[s.monIdx]||MUTED;
        const bar=(s.val/(allSpeeds[0]?.val||1)*100).toFixed(1);
        const rankBg=rank===0?"#ffd700":rank===1?"#c0c0c0":rank===2?"#cd7f32":"#e8f4ff";
        return e('div',{key:`${s.monIdx}-${s.label}`,style:{display:"grid",gridTemplateColumns:"24px 1fr auto",gap:"6px",alignItems:"center",marginBottom:"6px"}},
          e('div',{style:{width:"24px",height:"24px",borderRadius:"50%",background:rankBg,border:"2px solid rgba(0,0,0,0.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:"10px",fontWeight:"900",color:"#333",flexShrink:0}},rank+1),
          e('div',null,
            e('div',{style:{display:"flex",alignItems:"center",gap:"4px",marginBottom:"2px"}},
              e('span',{style:{fontSize:"9px",fontWeight:"900",padding:"1px 5px",borderRadius:"4px",background:col,color:"#fff"}},s.label),
              e('span',{style:{fontSize:"11px",fontWeight:"700",color:TEXT}},s.name||`ポケモン${s.monIdx+1}`)
            ),
            e('div',{style:{background:"#e8f4ff",borderRadius:"4px",height:"8px",overflow:"hidden"}},
              e('div',{style:{width:`${bar}%`,height:"100%",borderRadius:"4px",background:col,opacity:0.7}})
            )
          ),
          e('span',{style:{fontSize:"16px",fontWeight:"900",color:col,textAlign:"right"}},s.val)
        );
      })
    )
  );
}

          ),
          e('div',{style:{marginLeft:"auto",display:"flex",gap:"5px"}},
            e('button',{onClick:()=>setChampions(true),style:{padding:"4px 10px",borderRadius:"20px",border:"2px solid rgba(255,255,255,0.4)",fontWeight:"900",fontSize:"11px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:champions?"rgba(255,255,255,0.9)":"rgba(255,255,255,0.15)",color:champions?RED:"rgba(255,255,255,0.8)"}},"Champions"),
            e('button',{onClick:()=>setChampions(false),style:{padding:"4px 10px",borderRadius:"20px",border:"2px solid rgba(255,255,255,0.4)",fontWeight:"900",fontSize:"11px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",background:!champions?"rgba(255,255,255,0.9)":"rgba(255,255,255,0.15)",color:!champions?RED:"rgba(255,255,255,0.8)"}},"通常")
          )
        ),
        e('div',{style:{display:"flex",gap:"5px"}},
          [["damage","💥 ダメージ"],["speed","⚡ すばやさ"]].map(([k,l])=>
            e('button',{key:k,onClick:()=>setTab(k),style:{flex:1,padding:"6px 4px",background:tab===k?"rgba(255,255,255,0.95)":"rgba(255,255,255,0.15)",border:"none",borderRadius:"8px",color:tab===k?RED:"rgba(255,255,255,0.85)",fontWeight:"700",fontSize:"11px",cursor:"pointer",fontFamily:"'Nunito',sans-serif",boxShadow:tab===k?"0 2px 5px rgba(0,0,0,0.15)":"none"}},l)
          )
        )
      ),
      e('div',{style:{flex:1,overflow:"auto",padding:"12px",paddingBottom:"24px"}},
        tab==="damage"?e(DamageCalc,{champions}):e(SpeedCalc,{champions})
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
