<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ポケモン図鑑</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap');
    :root{--sky1:#5db8f5;--sky2:#a8d8f0;--grass:#7ec87e;--ground:#c8e6a0;--card:#fff;--card2:#f8fbff;--line:#dde8f4;--red:#e8342a;--red2:#c0281f;--orange:#f5881a;--blue:#2d72d9;--blue2:#1a5bbf;--yellow:#f5c518;--text:#1a2340;--text2:#3d5070;--muted:#7a90b0;--success:#2ea84c;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Noto Sans JP','Segoe UI',sans-serif;min-height:100vh;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--grass) 70%,var(--ground) 100%);background-attachment:fixed;color:var(--text);}
    body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(ellipse 60px 30px at 10% 12%,rgba(255,255,255,.55) 0%,transparent 70%),radial-gradient(ellipse 90px 35px at 25% 10%,rgba(255,255,255,.45) 0%,transparent 70%),radial-gradient(ellipse 70px 28px at 70% 8%,rgba(255,255,255,.5) 0%,transparent 70%),radial-gradient(ellipse 50px 22px at 85% 14%,rgba(255,255,255,.4) 0%,transparent 70%);}
    .wrap{max-width:1100px;margin:0 auto;padding:0 16px;position:relative;z-index:1;}
    header{background:linear-gradient(135deg,var(--red) 0%,var(--red2) 100%);box-shadow:0 3px 12px rgba(180,30,20,.35);position:relative;overflow:hidden;}
    header::after{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;border:18px solid rgba(0,0,0,.15);}
    header .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px;}
    .pokeball-icon{width:38px;height:38px;border-radius:50%;background:linear-gradient(180deg,#fff 50%,#1a1a1a 50%);border:3px solid #1a1a1a;position:relative;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3);}
    .pokeball-icon::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid #1a1a1a;}
    header h1{font-size:22px;font-weight:900;color:#fff;letter-spacing:.02em;}
    header .small{color:rgba(255,255,255,.75);font-size:11px;}
    main{padding:18px 0 60px;}
    .back{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);backdrop-filter:blur(4px);color:var(--blue2);text-decoration:none;font-size:13px;font-weight:700;padding:7px 14px;border-radius:999px;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.12);margin-bottom:16px;transition:background .15s,box-shadow .15s;}
    .back:hover{background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.18);}
    .grid{display:grid;gap:14px;}
    @media(min-width:800px){.grid{grid-template-columns:340px 1fr;}}
    .card{background:var(--card);border-radius:20px;padding:20px;box-shadow:0 4px 18px rgba(30,60,120,.10),0 1px 4px rgba(30,60,120,.07);border:1.5px solid rgba(255,255,255,.9);position:relative;overflow:hidden;}
    .card-search{border-top:4px solid var(--orange);}
    .card-adv{border-top:4px solid var(--blue);}
    .card-results{border-top:4px solid var(--success);}
    .card-detail{border-top:4px solid var(--red);}
    h2{font-size:15px;font-weight:800;margin-bottom:14px;color:var(--text);letter-spacing:.01em;}
    .label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px;}
    input,select{width:100%;background:#f0f5fc;border:1.5px solid var(--line);border-radius:10px;color:var(--text);padding:9px 12px;font-size:14px;font-family:inherit;outline:none;transition:border-color .2s,box-shadow .2s;}
    input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(45,114,217,.12);}
    input::placeholder{color:var(--muted);}
    .row{display:flex;gap:8px;flex-wrap:wrap;}
    button{padding:9px 18px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);background:#f0f5fc;color:var(--text2);font-family:inherit;transition:all .15s;box-shadow:0 1px 3px rgba(0,0,0,.08);}
    button:hover{background:#e0eaf8;border-color:#b8cce8;}
    button.primary{background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);border-color:var(--blue2);color:#fff;box-shadow:0 3px 10px rgba(45,114,217,.3);}
    button.primary:hover{background:linear-gradient(135deg,#3d82e8 0%,#2560c8 100%);box-shadow:0 4px 14px rgba(45,114,217,.4);}
    button.secondary{background:transparent;border-color:var(--blue);color:var(--blue);}
    .result-card{display:none;}
    .result-card.show{display:block;}
    .error-box{color:#d44;margin-top:10px;font-size:13px;font-weight:600;}
    .loading{color:var(--muted);margin-top:10px;font-size:13px;}
    .section-gap{margin-top:14px;}
    .preline{white-space:pre-wrap;}
    .result-card img{width:200px;max-width:100%;display:block;margin:0 auto 10px;filter:drop-shadow(0 4px 12px rgba(30,80,180,.18));}
    .stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
    @media(min-width:700px){.stat-grid{grid-template-columns:repeat(3,1fr);}}
    .mini-card{background:#f0f6ff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;}
    .mini-card strong{font-size:11px;color:var(--muted);display:block;margin-bottom:3px;}
    .mini-card div{font-size:15px;font-weight:700;color:var(--text);}
    .badge-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
    .badge{display:inline-block;padding:5px 12px;border:1.5px solid var(--line);border-radius:999px;font-size:12px;font-weight:600;background:#f0f5fc;color:var(--text2);}
    #pokeFlavor{background:#fdf8ef;border-left:3px solid var(--yellow);border-radius:0 10px 10px 0;padding:10px 14px;font-size:13px;color:var(--text2);line-height:1.7;}
    .adv-toggle{width:100%;text-align:left;background:#f0f6ff;border:1.5px dashed #b8cce8;color:var(--blue2);font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer;transition:all .2s;margin-top:12px;font-family:inherit;}
    .adv-toggle:hover,.adv-toggle.active{background:#e0eaf8;border-color:var(--blue);}
    .filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .stat-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
    .stat-filter-item label{font-size:11px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;}
    .stat-filter-item input{padding:7px 10px;font-size:13px;}
    #searchResultsCard{display:none;}
    #searchResultsCard.show{display:block;}
    .results-list{max-height:460px;overflow-y:auto;margin-top:10px;}
    .results-list::-webkit-scrollbar{width:5px;}
    .results-list::-webkit-scrollbar-thumb{background:#b8cce8;border-radius:4px;}
    .poke-result-item{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;cursor:pointer;transition:background .15s;border-bottom:1px solid var(--line);}
    .poke-result-item:last-child{border-bottom:none;}
    .poke-result-item:hover{background:#eef4ff;}
    .poke-result-item img{width:52px;height:52px;object-fit:contain;}
    .poke-result-item .poke-no{font-size:11px;color:var(--muted);font-weight:700;min-width:38px;}
    .poke-result-item .poke-name{font-size:14px;font-weight:700;color:var(--text);}
    .poke-result-item .poke-types{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;}
    .results-count{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:6px;}
    .pager{display:flex;align-items:center;gap:8px;margin-top:12px;justify-content:center;}
    .pager button{padding:6px 14px;font-size:12px;}
    .pager .page-info{font-size:12px;color:var(--muted);font-weight:700;}
    .evo-chain{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px;}
    .evo-btn{background:#f0f5fc;border:1.5px solid var(--blue);border-radius:999px;color:var(--blue2);font-size:13px;font-weight:700;padding:5px 14px;cursor:pointer;transition:all .15s;font-family:inherit;box-shadow:0 1px 4px rgba(45,114,217,.1);}
    .evo-btn:hover{background:#ddeeff;box-shadow:0 2px 8px rgba(45,114,217,.2);}
    .evo-btn.current{background:linear-gradient(135deg,var(--blue) 0%,var(--blue2) 100%);border-color:var(--blue2);color:#fff;cursor:default;box-shadow:0 2px 8px rgba(45,114,217,.3);}
    /* メガ/キョダイ専用ボタン */
    .evo-btn.mega{border-color:#9b30f5;color:#7010d0;}
    .evo-btn.mega:hover{background:#f3e8ff;}
    .evo-btn.mega.current{background:linear-gradient(135deg,#9b30f5,#7010d0);border-color:#7010d0;}
    .evo-btn.gmax{border-color:#f5a030;color:#c06000;}
    .evo-btn.gmax:hover{background:#fff3e0;}
    .evo-btn.gmax.current{background:linear-gradient(135deg,#f5a030,#c06000);border-color:#c06000;}
    .evo-arrow{color:var(--muted);font-size:16px;font-weight:900;}
    .poke-result-item .type-chip{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;border:1.5px solid;background:rgba(255,255,255,.7);}
    .type-normal{border-color:#9a9a60!important;color:#7a7a40;}
    .type-fire{border-color:#e06820!important;color:#c04800;}
    .type-water{border-color:#4870e0!important;color:#2850c0;}
    .type-electric{border-color:#c09800!important;color:#a07800;}
    .type-grass{border-color:#58a030!important;color:#388010;}
    .type-ice{border-color:#60b0b0!important;color:#409090;}
    .type-fighting{border-color:#b02020!important;color:#900000;}
    .type-poison{border-color:#902090!important;color:#700070;}
    .type-ground{border-color:#b08830!important;color:#906810;}
    .type-flying{border-color:#7060d0!important;color:#5040b0;}
    .type-psychic{border-color:#d84070!important;color:#b82050;}
    .type-bug{border-color:#889010!important;color:#687000;}
    .type-rock{border-color:#a88828!important;color:#886808;}
    .type-ghost{border-color:#605080!important;color:#403060;}
    .type-dragon{border-color:#5020d0!important;color:#3000b0;}
    .type-dark{border-color:#605040!important;color:#403020;}
    .type-steel{border-color:#8888a8!important;color:#686888;}
    .type-fairy{border-color:#d06080!important;color:#b04060;}
    .badge.t-normal{border-color:#9a9a60;color:#7a7a40;background:#f5f5e8;}
    .badge.t-fire{border-color:#e06820;color:#c04800;background:#fff0e8;}
    .badge.t-water{border-color:#4870e0;color:#2850c0;background:#eef0ff;}
    .badge.t-electric{border-color:#c09800;color:#a07800;background:#fffae0;}
    .badge.t-grass{border-color:#58a030;color:#388010;background:#f0fce8;}
    .badge.t-ice{border-color:#60b0b0;color:#409090;background:#eafafa;}
    .badge.t-fighting{border-color:#b02020;color:#900000;background:#ffeaea;}
    .badge.t-poison{border-color:#902090;color:#700070;background:#f8eef8;}
    .badge.t-ground{border-color:#b08830;color:#906810;background:#fdf5e0;}
    .badge.t-flying{border-color:#7060d0;color:#5040b0;background:#f0eeff;}
    .badge.t-psychic{border-color:#d84070;color:#b82050;background:#ffeef4;}
    .badge.t-bug{border-color:#889010;color:#687000;background:#f4f8e0;}
    .badge.t-rock{border-color:#a88828;color:#886808;background:#f8f4e0;}
    .badge.t-ghost{border-color:#605080;color:#403060;background:#f0eef8;}
    .badge.t-dragon{border-color:#5020d0;color:#3000b0;background:#eeebff;}
    .badge.t-dark{border-color:#605040;color:#403020;background:#f0ede8;}
    .badge.t-steel{border-color:#8888a8;color:#686888;background:#f0f0f5;}
    .badge.t-fairy{border-color:#d06080;color:#b04060;background:#ffeef2;}
    .hint{font-size:12px;color:var(--muted);background:rgba(255,255,255,.7);border-radius:10px;padding:8px 12px;border:1px solid rgba(255,255,255,.9);}
    .stat-bar-wrap{display:flex;flex-direction:column;gap:9px;}
    .stat-bar-row{display:flex;align-items:center;gap:8px;}
    .stat-bar-label{width:68px;font-size:11px;font-weight:700;color:var(--muted);text-align:right;flex-shrink:0;}
    .stat-bar-num{width:32px;font-size:13px;font-weight:800;text-align:right;flex-shrink:0;}
    .stat-bar-track{flex:1;height:10px;background:var(--line);border-radius:999px;overflow:hidden;}
    .stat-bar-fill{height:100%;border-radius:999px;transition:width .5s ease;}
    .stat-bst{font-size:12px;font-weight:800;color:var(--blue2);text-align:right;margin-top:6px;}
    .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
    @media(min-width:600px){.detail-grid{grid-template-columns:repeat(3,1fr);}}
    .move-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
    .move-tab{padding:5px 13px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px solid var(--line);background:#f0f5fc;color:var(--muted);cursor:pointer;transition:all .15s;font-family:inherit;}
    .move-tab.active{background:linear-gradient(135deg,var(--blue),var(--blue2));border-color:var(--blue2);color:#fff;box-shadow:0 2px 8px rgba(45,114,217,.25);}
    .move-tab:disabled{opacity:.4;cursor:default;}
    .move-table-wrap{overflow-x:auto;border-radius:12px;border:1.5px solid var(--line);max-height:400px;overflow-y:auto;}
    .move-table-wrap::-webkit-scrollbar{width:4px;}
    .move-table-wrap::-webkit-scrollbar-thumb{background:#b8cce8;border-radius:4px;}
    .move-table{width:100%;border-collapse:collapse;font-size:12px;min-width:320px;}
    .move-table thead{position:sticky;top:0;z-index:1;}
    .move-table th{background:#eef3fb;padding:7px 8px;text-align:left;color:var(--muted);font-size:10px;font-weight:800;letter-spacing:.06em;border-bottom:1.5px solid var(--line);white-space:nowrap;}
    .move-table td{padding:6px 8px;border-bottom:1px solid var(--line);color:var(--text2);white-space:nowrap;}
    .move-table tr:last-child td{border-bottom:none;}
    .move-table tbody tr:hover td{background:#f5f9ff;}
    .lv-badge{background:var(--blue);color:#fff;border-radius:4px;padding:1px 6px;font-size:10px;font-weight:800;}
    .dc-物理{color:#c04800;font-weight:700;font-size:11px;}
    .dc-特殊{color:#2850c0;font-weight:700;font-size:11px;}
    .dc-変化{color:#388010;font-weight:700;font-size:11px;}
    .move-loading{text-align:center;color:var(--muted);font-size:12px;padding:16px;}
    .flavor-list{max-height:200px;overflow-y:auto;border:1.5px solid var(--line);border-radius:12px;margin-top:8px;}
    .flavor-list::-webkit-scrollbar{width:4px;}
    .flavor-list::-webkit-scrollbar-thumb{background:#b8cce8;border-radius:4px;}
    .flavor-entry{padding:8px 12px;border-bottom:1px solid var(--line);}
    .flavor-entry:last-child{border-bottom:none;}
    .flavor-game-tag{font-size:10px;font-weight:800;color:var(--blue2);margin-bottom:3px;}
    .flavor-text-body{font-size:12px;color:var(--text2);line-height:1.7;}
    /* フォルム切替 */
    .form-section-label{font-size:10px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin:6px 0 4px;}
    #formSwitcher{background:rgba(248,244,255,.8);border:1.5px solid rgba(155,48,245,.2);border-radius:12px;padding:10px 12px;}
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="pokeball-icon"></div>
      <div><h1>ポケモン図鑑</h1><div class="small">図鑑 / 詳細検索</div></div>
    </div>
  </header>
  <main class="wrap">
    <a class="back" href="../">← ポケモンへ戻る</a>
    <div class="grid">
      <!-- 左カラム -->
      <div style="display:flex;flex-direction:column;gap:16px;">
        <section class="card card-search">
          <h2>🔍 名前 / 図鑑番号で検索</h2>
          <div class="label">ポケモン名 / 全国図鑑番号</div>
          <input id="searchInput" type="text" placeholder="例：pikachu / ピカチュウ / 25">
          <div class="row" style="margin-top:12px;">
            <button class="primary" id="searchBtn" type="button">検索</button>
            <button id="clearBtn" type="button">クリア</button>
          </div>
          <div class="loading" id="loadingText"></div>
          <div class="error-box" id="errorText"></div>
          <div id="mapStatus" style="font-size:11px;color:var(--muted);margin-top:6px;"></div>
        </section>
        <section class="card card-adv">
          <h2>🔎 詳細検索</h2>
          <div class="filter-grid">
            <div><div class="label">タイプ１</div>
              <select id="typeFilter1"><option value="">-- 指定なし --</option>
                <option value="normal">ノーマル</option><option value="fire">ほのお</option>
                <option value="water">みず</option><option value="electric">でんき</option>
                <option value="grass">くさ</option><option value="ice">こおり</option>
                <option value="fighting">かくとう</option><option value="poison">どく</option>
                <option value="ground">じめん</option><option value="flying">ひこう</option>
                <option value="psychic">エスパー</option><option value="bug">むし</option>
                <option value="rock">いわ</option><option value="ghost">ゴースト</option>
                <option value="dragon">ドラゴン</option><option value="dark">あく</option>
                <option value="steel">はがね</option><option value="fairy">フェアリー</option>
              </select></div>
            <div><div class="label">タイプ２</div>
              <select id="typeFilter2"><option value="">-- 指定なし --</option>
                <option value="normal">ノーマル</option><option value="fire">ほのお</option>
                <option value="water">みず</option><option value="electric">でんき</option>
                <option value="grass">くさ</option><option value="ice">こおり</option>
                <option value="fighting">かくとう</option><option value="poison">どく</option>
                <option value="ground">じめん</option><option value="flying">ひこう</option>
                <option value="psychic">エスパー</option><option value="bug">むし</option>
                <option value="rock">いわ</option><option value="ghost">ゴースト</option>
                <option value="dragon">ドラゴン</option><option value="dark">あく</option>
                <option value="steel">はがね</option><option value="fairy">フェアリー</option>
              </select></div>
          </div>
          <div style="margin-top:12px;"><div class="label">世代</div>
            <select id="genFilter"><option value="">-- 指定なし --</option>
              <option value="1">第1世代（カントー）</option><option value="2">第2世代（ジョウト）</option>
              <option value="3">第3世代（ホウエン）</option><option value="4">第4世代（シンオウ）</option>
              <option value="5">第5世代（イッシュ）</option><option value="6">第6世代（カロス）</option>
              <option value="7">第7世代（アローラ）</option><option value="8">第8世代（ガラル）</option>
              <option value="9">第9世代（パルデア）</option>
            </select></div>
          <button class="adv-toggle" id="statToggle" type="button">▸ 種族値フィルター</button>
          <div id="statPanel" style="display:none;">
            <div class="stat-filters">
              <div class="stat-filter-item"><label>HP 以上</label><input type="number" id="minHp" placeholder="0" min="0" max="255"></div>
              <div class="stat-filter-item"><label>こうげき 以上</label><input type="number" id="minAtk" placeholder="0" min="0" max="255"></div>
              <div class="stat-filter-item"><label>ぼうぎょ 以上</label><input type="number" id="minDef" placeholder="0" min="0" max="255"></div>
              <div class="stat-filter-item"><label>とくこう 以上</label><input type="number" id="minSpAtk" placeholder="0" min="0" max="255"></div>
              <div class="stat-filter-item"><label>とくぼう 以上</label><input type="number" id="minSpDef" placeholder="0" min="0" max="255"></div>
              <div class="stat-filter-item"><label>すばやさ 以上</label><input type="number" id="minSpeed" placeholder="0" min="0" max="255"></div>
              <div class="stat-filter-item" style="grid-column:1/-1;"><label>合計種族値 以上</label><input type="number" id="minBst" placeholder="0" min="0" max="1125"></div>
            </div>
          </div>
          <div class="row" style="margin-top:14px;">
            <button class="primary" id="advSearchBtn" type="button">詳細検索を実行</button>
            <button id="advClearBtn" type="button">リセット</button>
          </div>
          <div class="loading" id="advLoadingText"></div>
          <div class="error-box" id="advErrorText"></div>
        </section>
        <div class="hint">補完データ管理ページで入れた地方図鑑番号・作品別データ・補足メモも表示されます。</div>
      </div>
      <!-- 右カラム -->
      <div style="display:flex;flex-direction:column;gap:16px;">
        <section class="card card-results" id="searchResultsCard">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <h2 id="resultsTitle">検索結果</h2>
            <button id="resultsCloseBtn" type="button" style="padding:4px 10px;font-size:12px;">✕ 閉じる</button>

  function getFormJaLabel(pokemonName, speciesName) {
    if (pokemonName === speciesName) return "通常のすがた";
    const suffix = pokemonName.startsWith(speciesName + "-")
      ? pokemonName.slice(speciesName.length + 1) : pokemonName;
    if (FORM_SUFFIX_JA[suffix]) return FORM_SUFFIX_JA[suffix];
    // Try compound suffixes
    const parts = suffix.split("-");
    const joined = parts.slice(0,2).join("-");
    if (FORM_SUFFIX_JA[joined]) return FORM_SUFFIX_JA[joined];
    return suffix.split("-").map(p=>FORM_SUFFIX_JA[p]||p).join(" ") || suffix;
  }

  async function renderFormSwitcher(species, currentName) {
    if (!formSection || !formSwitcher) return;
    formSection.style.display = "none";
    formSwitcher.innerHTML = "";
    const varieties = (species.varieties || []);
    if (varieties.length <= 1) return;
    formSection.style.display = "block";

    const megas = varieties.filter(v => v.pokemon.name.includes("-mega") || v.pokemon.name.includes("-gmax"));
    const defaultV = varieties.find(v => v.is_default);
    const defaultName = defaultV?.pokemon.name || species.name;
    const others = varieties.filter(v => {
      const n = v.pokemon.name;
      return !n.includes("-mega") && !n.includes("-gmax") && n !== defaultName;
    });

    function makeBtn(name, cls="") {
      const btn = document.createElement("button");
      btn.className = "evo-btn" + (name===currentName?" current":"") + (cls?" "+cls:"");
      btn.textContent = getFormJaLabel(name, species.name);
      if (name !== currentName) btn.addEventListener("click", ()=>loadPokemonDetail(name));
      return btn;
    }

    if (megas.length) {
      const lbl = document.createElement("div");
      lbl.className = "form-section-label";
      lbl.textContent = "💜 メガシンカ / キョダイマックス";
      formSwitcher.appendChild(lbl);
      const row = document.createElement("div");
      row.className = "evo-chain";
      row.appendChild(makeBtn(defaultName));
      megas.forEach(v => {
        const n = v.pokemon.name;
        const cls = n.includes("-gmax") ? "gmax" : "mega";
        row.appendChild(makeBtn(n, cls));
      });
      formSwitcher.appendChild(row);
    }

    if (others.length) {
      const lbl = document.createElement("div");
      lbl.className = "form-section-label";
      lbl.textContent = "🌍 地方のすがた / フォルム";
      formSwitcher.appendChild(lbl);
      const row = document.createElement("div");
      row.className = "evo-chain";
      const baseBtn = makeBtn(defaultName);
      baseBtn.textContent += "（通常）";
      row.appendChild(baseBtn);
      others.forEach(v => row.appendChild(makeBtn(v.pokemon.name)));
      formSwitcher.appendChild(row);
    }
  }
