<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ポケモン図鑑</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&display=swap');

    :root {
      --sky1: #5db8f5;
      --sky2: #a8d8f0;
      --grass: #7ec87e;
      --ground: #c8e6a0;
      --card: #ffffff;
      --card2: #f8fbff;
      --line: #dde8f4;
      --red: #e8342a;
      --red2: #c0281f;
      --orange: #f5881a;
      --blue: #2d72d9;
      --blue2: #1a5bbf;
      --yellow: #f5c518;
      --text: #1a2340;
      --text2: #3d5070;
      --muted: #7a90b0;
      --success: #2ea84c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans JP', 'Segoe UI', sans-serif;
      min-height: 100vh;
      background:
        linear-gradient(180deg, var(--sky1) 0%, var(--sky2) 45%, var(--grass) 70%, var(--ground) 100%);
      background-attachment: fixed;
      color: var(--text);
    }

    /* Floating cloud dots */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        radial-gradient(ellipse 60px 30px at 10% 12%, rgba(255,255,255,.55) 0%, transparent 70%),
        radial-gradient(ellipse 90px 35px at 25% 10%, rgba(255,255,255,.45) 0%, transparent 70%),
        radial-gradient(ellipse 70px 28px at 70% 8%,  rgba(255,255,255,.5)  0%, transparent 70%),
        radial-gradient(ellipse 50px 22px at 85% 14%, rgba(255,255,255,.4)  0%, transparent 70%),
        radial-gradient(ellipse 40px 18px at 50% 20%, rgba(255,255,255,.35) 0%, transparent 70%);
    }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 1; }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--red) 0%, var(--red2) 100%);
      box-shadow: 0 3px 12px rgba(180,30,20,.35);
      position: relative; overflow: hidden;
    }
    header::after {
      content: '';
      position: absolute; right: -30px; top: -30px;
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 18px solid rgba(0,0,0,.15);
    }
    header .wrap { display: flex; align-items: center; gap: 12px; padding-top: 14px; padding-bottom: 14px; }
    .pokeball-icon {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(180deg, #fff 50%, #1a1a1a 50%);
      border: 3px solid #1a1a1a;
      position: relative; flex-shrink: 0;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
    }
    .pokeball-icon::after {
      content: ''; position: absolute;
      top: 50%; left: 50%; transform: translate(-50%,-50%);
      width: 11px; height: 11px; border-radius: 50%;
      background: #fff; border: 3px solid #1a1a1a;
    }
    header h1 { font-size: 22px; font-weight: 900; color: #fff; letter-spacing: .02em; }
    header .small { color: rgba(255,255,255,.75); font-size: 11px; }

    /* ── Main ── */
    main { padding: 18px 0 60px; }

    .back {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.85); backdrop-filter: blur(4px);
      color: var(--blue2); text-decoration: none; font-size: 13px; font-weight: 700;
      padding: 7px 14px; border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,.9);
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      margin-bottom: 16px;
      transition: background .15s, box-shadow .15s;
    }
    .back:hover { background: #fff; box-shadow: 0 3px 12px rgba(0,0,0,.18); }

    .grid { display: grid; gap: 14px; }
    @media(min-width: 800px) { .grid { grid-template-columns: 340px 1fr; } }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(30,60,120,.10), 0 1px 4px rgba(30,60,120,.07);
      border: 1.5px solid rgba(255,255,255,.9);
      position: relative; overflow: hidden;
    }
    /* Colored top stripe per card */
    .card-search { border-top: 4px solid var(--orange); }
    .card-adv    { border-top: 4px solid var(--blue); }
    .card-results{ border-top: 4px solid var(--success); }
    .card-detail { border-top: 4px solid var(--red); }

    h2 {
      font-size: 15px; font-weight: 800; margin-bottom: 14px;
      color: var(--text); letter-spacing: .01em;
    }
    .label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .1em; margin-bottom: 6px;
    }

    /* ── Inputs ── */
    input, select {
      width: 100%;
      background: #f0f5fc;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      padding: 9px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(45,114,217,.12);
    }
    input::placeholder { color: var(--muted); }

    .row { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ── Buttons ── */
    button {
      padding: 9px 18px; border-radius: 999px; font-size: 13px; font-weight: 700;
      cursor: pointer; border: 1.5px solid var(--line);
      background: #f0f5fc; color: var(--text2);
      font-family: inherit;
      transition: all .15s;
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    button:hover { background: #e0eaf8; border-color: #b8cce8; }

    button.primary {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      border-color: var(--blue2); color: #fff;
      box-shadow: 0 3px 10px rgba(45,114,217,.3);
    }
    button.primary:hover {
      background: linear-gradient(135deg, #3d82e8 0%, #2560c8 100%);
      box-shadow: 0 4px 14px rgba(45,114,217,.4);
    }
    button.secondary {
      background: transparent; border-color: var(--blue); color: var(--blue);
    }
    button.secondary:hover { background: rgba(45,114,217,.07); }

    /* ── State ── */
    .result-card { display: none; }
    .result-card.show { display: block; }
    .error-box { color: #d44; margin-top: 10px; font-size: 13px; font-weight: 600; }
    .loading { color: var(--muted); margin-top: 10px; font-size: 13px; }
    .section-gap { margin-top: 14px; }
    .preline { white-space: pre-wrap; }

    /* ── Detail card internals ── */
    .result-card img {
      width: 200px; max-width: 100%; display: block; margin: 0 auto 10px;
      filter: drop-shadow(0 4px 12px rgba(30,80,180,.18));
    }
    .stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; }
    @media(min-width:700px){ .stat-grid { grid-template-columns: repeat(3,1fr); } }

    .mini-card {
      background: #f0f6ff;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
    }
    .mini-card strong { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
    .mini-card div { font-size: 15px; font-weight: 700; color: var(--text); }

    .badge-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .badge {
      display: inline-block; padding: 5px 12px;
      border: 1.5px solid var(--line);
      border-radius: 999px; font-size: 12px; font-weight: 600;
      background: #f0f5fc; color: var(--text2);
    }

    /* ── Flavor text ── */
    #pokeFlavor {
      background: #fdf8ef;
      border-left: 3px solid var(--yellow);
      border-radius: 0 10px 10px 0;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text2);
      line-height: 1.7;
    }

    /* ── Advanced search ── */
    .adv-toggle {
      width: 100%; text-align: left;
      background: #f0f6ff; border: 1.5px dashed #b8cce8;
      color: var(--blue2); font-size: 13px; font-weight: 700;
      padding: 8px 14px; border-radius: 10px;
      cursor: pointer; transition: all .2s; margin-top: 12px;
      font-family: inherit;
    }
    .adv-toggle:hover { background: #e0eaf8; border-color: var(--blue); }
    .adv-toggle.active { background: #e0eaf8; border-color: var(--blue); border-style: solid; }

    .filter-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat-filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .stat-filter-item label { font-size: 11px; font-weight: 700; color: var(--muted); display: block; margin-bottom: 4px; }
    .stat-filter-item input { padding: 7px 10px; font-size: 13px; }

    /* ── Results list ── */
    #searchResultsCard { display: none; }
    #searchResultsCard.show { display: block; }
    .results-list { max-height: 460px; overflow-y: auto; margin-top: 10px; }
    .results-list::-webkit-scrollbar { width: 5px; }
    .results-list::-webkit-scrollbar-track { background: #f0f5fc; border-radius: 4px; }
    .results-list::-webkit-scrollbar-thumb { background: #b8cce8; border-radius: 4px; }

    .poke-result-item {
      display: flex; align-items: center; gap: 12px; padding: 10px 10px;
      border-radius: 12px; cursor: pointer; transition: background .15s;
      border-bottom: 1px solid var(--line);
    }
    .poke-result-item:last-child { border-bottom: none; }
    .poke-result-item:hover { background: #eef4ff; }
    .poke-result-item img { width: 52px; height: 52px; object-fit: contain; }
    .poke-result-item .poke-no { font-size: 11px; color: var(--muted); font-weight: 700; min-width: 38px; }
    .poke-result-item .poke-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .poke-result-item .poke-types { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
    .results-count { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }

    .pager { display: flex; align-items: center; gap: 8px; margin-top: 12px; justify-content: center; }
    .pager button { padding: 6px 14px; font-size: 12px; }
    .pager .page-info { font-size: 12px; color: var(--muted); font-weight: 700; }

    /* ── Evolution chain ── */
    .evo-chain { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .evo-btn {
      background: #f0f5fc; border: 1.5px solid var(--blue);
      border-radius: 999px; color: var(--blue2);
      font-size: 13px; font-weight: 700; padding: 5px 14px;
      cursor: pointer; transition: all .15s; font-family: inherit;
      box-shadow: 0 1px 4px rgba(45,114,217,.1);
    }
    .evo-btn:hover { background: #ddeeff; box-shadow: 0 2px 8px rgba(45,114,217,.2); }
    .evo-btn.current {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      border-color: var(--blue2); color: #fff; cursor: default;
      box-shadow: 0 2px 8px rgba(45,114,217,.3);
    }
    .evo-arrow { color: var(--muted); font-size: 16px; font-weight: 900; }

    /* ── Type chips ── */
    .poke-result-item .type-chip {
      font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
      border: 1.5px solid; background: rgba(255,255,255,.7);
    }
    .results-loading { color: var(--muted); font-size: 13px; padding: 12px 0; text-align: center; }

    /* Type colors — readable on light bg */
    .type-normal   { border-color: #9a9a60 !important; color: #7a7a40; }
    .type-fire     { border-color: #e06820 !important; color: #c04800; }
    .type-water    { border-color: #4870e0 !important; color: #2850c0; }
    .type-electric { border-color: #c09800 !important; color: #a07800; }
    .type-grass    { border-color: #58a030 !important; color: #388010; }
    .type-ice      { border-color: #60b0b0 !important; color: #409090; }
    .type-fighting { border-color: #b02020 !important; color: #900000; }
    .type-poison   { border-color: #902090 !important; color: #700070; }
    .type-ground   { border-color: #b08830 !important; color: #906810; }
    .type-flying   { border-color: #7060d0 !important; color: #5040b0; }
    .type-psychic  { border-color: #d84070 !important; color: #b82050; }
    .type-bug      { border-color: #889010 !important; color: #687000; }
    .type-rock     { border-color: #a88828 !important; color: #886808; }
    .type-ghost    { border-color: #605080 !important; color: #403060; }
    .type-dragon   { border-color: #5020d0 !important; color: #3000b0; }
    .type-dark     { border-color: #605040 !important; color: #403020; }
    .type-steel    { border-color: #8888a8 !important; color: #686888; }
    .type-fairy    { border-color: #d06080 !important; color: #b04060; }

    /* Badge type colors (detail view) */
    .badge.t-normal   { border-color: #9a9a60; color: #7a7a40; background: #f5f5e8; }
    .badge.t-fire     { border-color: #e06820; color: #c04800; background: #fff0e8; }
    .badge.t-water    { border-color: #4870e0; color: #2850c0; background: #eef0ff; }
    .badge.t-electric { border-color: #c09800; color: #a07800; background: #fffae0; }
    .badge.t-grass    { border-color: #58a030; color: #388010; background: #f0fce8; }
    .badge.t-ice      { border-color: #60b0b0; color: #409090; background: #eafafa; }
    .badge.t-fighting { border-color: #b02020; color: #900000; background: #ffeaea; }
    .badge.t-poison   { border-color: #902090; color: #700070; background: #f8eef8; }
    .badge.t-ground   { border-color: #b08830; color: #906810; background: #fdf5e0; }
    .badge.t-flying   { border-color: #7060d0; color: #5040b0; background: #f0eeff; }
    .badge.t-psychic  { border-color: #d84070; color: #b82050; background: #ffeef4; }
    .badge.t-bug      { border-color: #889010; color: #687000; background: #f4f8e0; }
    .badge.t-rock     { border-color: #a88828; color: #886808; background: #f8f4e0; }
    .badge.t-ghost    { border-color: #605080; color: #403060; background: #f0eef8; }
    .badge.t-dragon   { border-color: #5020d0; color: #3000b0; background: #eeebff; }
    .badge.t-dark     { border-color: #605040; color: #403020; background: #f0ede8; }
    .badge.t-steel    { border-color: #8888a8; color: #686888; background: #f0f0f5; }
    .badge.t-fairy    { border-color: #d06080; color: #b04060; background: #ffeef2; }

    /* ── Section dividers inside detail card ── */
    .section-heading {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .section-heading .label { margin-bottom: 0; }
    .section-heading::after {
      content: ''; flex: 1; height: 1px; background: var(--line);
    }

    /* ── Party add status ── */
    #partyAddStatus { color: var(--success); font-weight: 700; }

    /* ── Hint text ── */
    .hint {
      font-size: 12px; color: var(--muted);
      background: rgba(255,255,255,.7);
      border-radius: 10px; padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.9);
    }
    /* ── Stat bars ── */
    .stat-bar-wrap { display: flex; flex-direction: column; gap: 9px; }
    .stat-bar-row { display: flex; align-items: center; gap: 8px; }
    .stat-bar-label { width: 68px; font-size: 11px; font-weight: 700; color: var(--muted); text-align: right; flex-shrink: 0; }
    .stat-bar-num { width: 32px; font-size: 13px; font-weight: 800; text-align: right; flex-shrink: 0; }
    .stat-bar-track { flex: 1; height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .stat-bar-fill { height: 100%; border-radius: 999px; transition: width .5s ease; }
    .stat-bst { font-size: 12px; font-weight: 800; color: var(--blue2); text-align: right; margin-top: 6px; }

    /* ── Detail info grid ── */
    .detail-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; }
    @media(min-width:600px){ .detail-grid { grid-template-columns: repeat(3,1fr); } }

    /* ── Move tabs ── */
    .move-tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
    .move-tab { padding: 5px 13px; border-radius: 999px; font-size: 12px; font-weight: 700;
      border: 1.5px solid var(--line); background: #f0f5fc; color: var(--muted);
      cursor: pointer; transition: all .15s; font-family: inherit; }
    .move-tab:hover:not(:disabled) { border-color: var(--blue); color: var(--blue2); }
    .move-tab.active { background: linear-gradient(135deg, var(--blue), var(--blue2)); border-color: var(--blue2); color: #fff; box-shadow: 0 2px 8px rgba(45,114,217,.25); }
    .move-tab:disabled { opacity: .4; cursor: default; }

    /* ── Move table ── */
    .move-table-wrap { overflow-x: auto; border-radius: 12px; border: 1.5px solid var(--line); max-height: 400px; overflow-y: auto; }
    .move-table-wrap::-webkit-scrollbar { width: 4px; }
    .move-table-wrap::-webkit-scrollbar-thumb { background: #b8cce8; border-radius: 4px; }
    .move-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 320px; }
    .move-table thead { position: sticky; top: 0; z-index: 1; }
    .move-table th { background: #eef3fb; padding: 7px 8px; text-align: left; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .06em; border-bottom: 1.5px solid var(--line); white-space: nowrap; }
    .move-table td { padding: 6px 8px; border-bottom: 1px solid var(--line); color: var(--text2); white-space: nowrap; }
    .move-table tr:last-child td { border-bottom: none; }
    .move-table tbody tr:hover td { background: #f5f9ff; }
    .lv-badge { background: var(--blue); color: #fff; border-radius: 4px; padding: 1px 6px; font-size: 10px; font-weight: 800; }
    .dc-物理 { color: #c04800; font-weight: 700; font-size: 11px; }
    .dc-特殊 { color: #2850c0; font-weight: 700; font-size: 11px; }
    .dc-変化 { color: #388010; font-weight: 700; font-size: 11px; }
    .move-loading { text-align: center; color: var(--muted); font-size: 12px; padding: 16px; }

    /* ── Flavor scroll ── */
    .flavor-list { max-height: 200px; overflow-y: auto; border: 1.5px solid var(--line); border-radius: 12px; margin-top: 8px; }
    .flavor-list::-webkit-scrollbar { width: 4px; }
    .flavor-list::-webkit-scrollbar-thumb { background: #b8cce8; border-radius: 4px; }
    .flavor-entry { padding: 8px 12px; border-bottom: 1px solid var(--line); }
    .flavor-entry:last-child { border-bottom: none; }
    .flavor-game-tag { font-size: 10px; font-weight: 800; color: var(--blue2); margin-bottom: 3px; }
    .flavor-text-body { font-size: 12px; color: var(--text2); line-height: 1.7; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="pokeball-icon"></div>
      <div>
        <h1>ポケモン図鑑</h1>
        <div class="small">図鑑 / 詳細検索</div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <a class="back" href="../">← ポケモンへ戻る</a>

    <div class="grid">
      <!-- ── Left Column: Search Controls ── -->
      <div style="display:flex;flex-direction:column;gap:16px;">

        <!-- Basic Search Card -->
        <section class="card card-search">
          <h2>🔍 名前 / 図鑑番号で検索</h2>
          <div class="label">ポケモン名 / 全国図鑑番号</div>
          <input id="searchInput" type="text" placeholder="例：pikachu / ピカチュウ / 25">
          <div class="row" style="margin-top:12px;">
            <button class="primary" id="searchBtn" type="button">検索</button>
            <button id="clearBtn" type="button">クリア</button>
          </div>
          <div class="loading" id="loadingText"></div>
          <div class="error-box" id="errorText"></div>
          <div id="mapStatus" style="font-size:11px;color:var(--muted);margin-top:6px;"></div>
        </section>

        <!-- Advanced Search Card -->
        <section class="card card-adv">
          <h2>🔎 詳細検索</h2>

          <div class="filter-grid">
            <div>
              <div class="label">タイプ１</div>
              <select id="typeFilter1">
                <option value="">-- 指定なし --</option>
                <option value="normal">ノーマル</option>
                <option value="fire">ほのお</option>
                <option value="water">みず</option>
                <option value="electric">でんき</option>
                <option value="grass">くさ</option>
                <option value="ice">こおり</option>
                <option value="fighting">かくとう</option>
                <option value="poison">どく</option>
                <option value="ground">じめん</option>
                <option value="flying">ひこう</option>
                <option value="psychic">エスパー</option>
                <option value="bug">むし</option>
                <option value="rock">いわ</option>
                <option value="ghost">ゴースト</option>
                <option value="dragon">ドラゴン</option>
                <option value="dark">あく</option>
                <option value="steel">はがね</option>
                <option value="fairy">フェアリー</option>
              </select>
            </div>
            <div>
              <div class="label">タイプ２</div>
              <select id="typeFilter2">
                <option value="">-- 指定なし --</option>
                <option value="normal">ノーマル</option>
                <option value="fire">ほのお</option>
                <option value="water">みず</option>
                <option value="electric">でんき</option>
                <option value="grass">くさ</option>
                <option value="ice">こおり</option>
                <option value="fighting">かくとう</option>
                <option value="poison">どく</option>

    // ── Caches ──
    const fetchCache = {};
    const dexCache   = {};
    let   jaNameMap  = null;
    let   mapReady   = false;
    let   mapBuildPromise = null;
    let   currentPokemonData = null;
    let   currentMoveMethod  = null;

    // ── Pagination state ──
    const PAGE_SIZE = 20;
    let advResults  = [];
    let currentPage = 1;

    // ── Utilities ──
    function escapeHtml(t) {
      return String(t ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;")
        .replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }

    async function cachedFetchJson(url) {
      if (fetchCache[url]) return fetchCache[url];
      const res = await fetch(url);
      if (!res.ok) throw new Error("fetch_failed: " + url);
      const data = await res.json();
      fetchCache[url] = data;
      return data;
    }

    async function buildJaNameMap() {
      if (jaNameMap) return jaNameMap;
      jaNameMap = {};
      try {
        const listData = await cachedFetchJson(`${API_BASE}/pokemon-species?limit=2000`);
        const urls = (listData.results || []).map(item => item.url);
        const BATCH = 30; // 30件並列で取得
        for (let i = 0; i < urls.length; i += BATCH) {
          const batch = urls.slice(i, i + BATCH);
          const results = await Promise.allSettled(batch.map(url => cachedFetchJson(url)));
          for (const r of results) {
            if (r.status !== "fulfilled") continue;
            const s = r.value;
            const ja = s.names?.find(n => n.language.name === "ja-Hrkt")?.name
                    || s.names?.find(n => n.language.name === "ja")?.name;
            if (ja && s.name) jaNameMap[ja] = s.name;
          }
        }
      } catch(_) {}
      return jaNameMap;
    }

    async function normalizeQuery(value) {
      const raw = value.trim();
      if (!raw) return "";
      if (/^\d+$/.test(raw)) return raw;
      if (JA_TO_EN[raw]) return JA_TO_EN[raw];

      // 日本語っぽい入力のとき、マップが完成するまで待つ
      if (/[\u3040-\u30FF\u4E00-\u9FFF]/.test(raw)) {
        if (!mapReady) {
          loadingText.textContent = "日本語名マップ取得中... 少々お待ちください";
          await mapBuildPromise;
          loadingText.textContent = "";
        }
        if (jaNameMap && jaNameMap[raw]) return jaNameMap[raw];
      }

      return raw.toLowerCase().replaceAll("♀","-f").replaceAll("♂","-m")
                .replaceAll("　"," ").replaceAll(" ","-");
    }

    function loadCustomData() {
      try { return JSON.parse(localStorage.getItem(CUSTOM_KEY) || "[]"); }
      catch { return []; }
    }

    function findCustomRecord(nameJa, nationalNo) {
      return loadCustomData().find(r =>
        (r.name||"").trim() === (nameJa||"").trim() ||
        String(r.nationalDex||"").trim() === String(nationalNo||"").trim()
      ) || null;
    }

    function getJapaneseName(species) {
      return species.names?.find(n => n.language.name === "ja-Hrkt")?.name
          || species.names?.find(n => n.language.name === "ja")?.name
          || species.name;
    }

    function getJapaneseFlavor(species) {
      const e = (species.flavor_text_entries||[]).find(x=>x.language?.name==="ja-Hrkt")
             || (species.flavor_text_entries||[]).find(x=>x.language?.name==="ja");
      return e ? e.flavor_text.replace(/\f|\n|\r/g," ") : "";
    }

    async function fetchAndFillMoveDetails(methodMap) {
      const allMoves=[]; const seen=new Set();
      for (const moves of Object.values(methodMap)) {
        for (const m of moves) {
          if (!seen.has(m.enName)) { seen.add(m.enName); allMoves.push(m); }
        }
      }
      const BATCH=15;
      for (let i=0; i<allMoves.length; i+=BATCH) {
        const batch=allMoves.slice(i,i+BATCH);
        const results=await Promise.allSettled(batch.map(m=>cachedFetchJson(m.url)));
        results.forEach((r,idx)=>{
          if (r.status!=="fulfilled") return;
          const d=r.value; const m=batch[idx];
          m.jaName = d.names?.find(n=>n.language.name==="ja-Hrkt")?.name
                  || d.names?.find(n=>n.language.name==="ja")?.name || m.enName;
          m.type   = d.type?.name||null;
          m.dc     = DAMAGE_CLASS_JA[d.damage_class?.name]||null;
          m.power  = d.power!=null?d.power:"—";
          m.acc    = d.accuracy!=null?d.accuracy:"—";
          m.pp     = d.pp!=null?d.pp:null;
          // Live-update the visible table row
          const tbl=moveTableContainer.querySelector(".move-table");
          if (!tbl) return;
          const row=tbl.querySelector(`tr[data-move-name="${m.enName}"]`);
          if (!row) return;
          const nc=row.querySelector(".cell-name"); if(nc) nc.textContent=m.jaName;
          const tc=row.querySelector(".cell-type");
          if (tc&&m.type) tc.innerHTML=`<span class="badge t-${m.type}" style="font-size:10px;padding:2px 7px;">${TYPE_JA[m.type]||m.type}</span>`;
          const dc=row.querySelector(".cell-dc");
          if (dc&&m.dc) dc.innerHTML=`<span class="dc-${m.dc}">${m.dc}</span>`;
          const pc=row.querySelector(".cell-power"); if(pc) pc.textContent=m.power;
          const ac=row.querySelector(".cell-acc");   if(ac) ac.textContent=m.acc!=="—"?m.acc+"%":"—";
          const pp=row.querySelector(".cell-pp");    if(pp&&m.pp!=null) pp.textContent=m.pp;
        });
      }
    }

    function renderMoves(pokemonMoves) {
      moveTabs.innerHTML="";
      moveTableContainer.innerHTML=`<div class="move-loading">技データ整理中...</div>`;
      const methodMap={"level-up":[],"machine":[],"egg":[],"tutor":[]};
      for (const m of pokemonMoves) {
        const details=m.version_group_details; if (!details?.length) continue;
        let best=details[0];
        for (const d of details) {
          const pi=VERSION_PRIORITY.indexOf(best.version_group.name);
          const di=VERSION_PRIORITY.indexOf(d.version_group.name);
          if (di!==-1&&(pi===-1||di<pi)) best=d;
        }
        const meth=best.move_learn_method.name;
        if (meth in methodMap) methodMap[meth].push({enName:m.move.name,url:m.move.url,level:best.level_learned_at});
      }
      methodMap["level-up"].sort((a,b)=>a.level-b.level);
      let firstActive=null;
      ["level-up","machine","egg","tutor"].forEach(meth=>{
        const moves=methodMap[meth];
        const btn=document.createElement("button"); btn.className="move-tab";
        btn.textContent=`${MOVE_METHOD_JA[meth]}（${moves.length}）`;
        btn.dataset.method=meth;
        if (!moves.length) { btn.disabled=true; }
        else {
          if (!firstActive){ firstActive=meth; btn.classList.add("active"); }
          btn.addEventListener("click",()=>{
            moveTabs.querySelectorAll(".move-tab").forEach(t=>t.classList.remove("active"));
            btn.classList.add("active");
            renderMoveTable(meth,methodMap[meth]);
          });
        }
        moveTabs.appendChild(btn);
      });
      if (firstActive) renderMoveTable(firstActive,methodMap[firstActive]);
      else moveTableContainer.innerHTML=`<div class="move-loading">習得技データなし</div>`;
      // Fetch details in background (no await — progressive update)
      fetchAndFillMoveDetails(methodMap).catch(()=>{});
    }

    function calculateTypeEffectiveness(typeNames) {
      return Object.keys(TYPE_CHART).map(atk => {
        let m = 1;
        for (const def of typeNames) {
          const c = TYPE_CHART[def]; if (!c) continue;
          if (c.immune.includes(atk)) m *= 0;
          else if (c.weak.includes(atk)) m *= 2;
          else if (c.resist.includes(atk)) m *= 0.5;
        }
        return { type: atk, multiplier: m };
      });
    }

    function renderTypeEffectiveness(typeNames) {
      const data = calculateTypeEffectiveness(typeNames);
      renderBadgeList(weaknessList, data.filter(x=>x.multiplier>1).map(x=>`${TYPE_JA[x.type]||x.type} x${x.multiplier}`));
      renderBadgeList(resistList,   data.filter(x=>x.multiplier>0&&x.multiplier<1).map(x=>`${TYPE_JA[x.type]||x.type} x${x.multiplier}`));
      renderBadgeList(immuneList,   data.filter(x=>x.multiplier===0).map(x=>TYPE_JA[x.type]||x.type));
    }

    async function getLocalDexNumbers(speciesName) {
      const results = [];
      for (const dex of POKEDEXES) {

          if (num !== null) results.push({ label: dex.label, number: num, source: "api" });

      const merged = [...apiEntries];
      const existing = new Set(apiEntries.map(x=>x.label));
      (customRecord?.localDex||[]).forEach(item => {
        if (!existing.has(item.key)) merged.push({ label:item.key, number:item.value, source:"custom" });
      });
      return merged;

    async function fetchEvolutionNames(species) {
      if (!species.evolution_chain?.url) return [];
      const chain = await cachedFetchJson(species.evolution_chain.url);
      const enNames = [];
      function walk(node) {
        if (!node) return;
        if (node.species?.name) enNames.push(node.species.name);
        (node.evolves_to||[]).forEach(walk);
      }
      walk(chain.chain);
      const result = [];
      for (const en of enNames) {
        try {
          const s = await cachedFetchJson(`${API_BASE}/pokemon-species/${en}`);
          const ja = s.names?.find(n=>n.language.name==="ja-Hrkt")?.name
                  || s.names?.find(n=>n.language.name==="ja")?.name || en;
          result.push({ ja, en });
        } catch(_) { result.push({ ja: en, en }); }
      }
      return result;
    }

    // Returns set of pokemon species names for a type
    async function fetchPokemonByType(typeName) {
      const data = await cachedFetchJson(`${API_BASE}/type/${typeName}`);
      // includes both pokemon.pokemon.name (form names) — use species instead if available
      return new Set(
        (data.pokemon || []).map(p => {
          // strip form suffixes to get base name for matching
          return p.pokemon.name;
        })
      );
    }

    // Returns all pokemon names in a generation (by national dex range)
    async function fetchPokemonByGen(genNum) {
      const [min, max] = GEN_RANGES[genNum];
      // fetch species list and filter by id
      const data = await cachedFetchJson(`${API_BASE}/pokemon?limit=2000&offset=0`);
      // pokemon endpoint doesn't give id directly, but names follow pattern
      // More reliably: fetch generation endpoint
      const genData = await cachedFetchJson(`${API_BASE}/generation/${genNum}`);
      return new Set((genData.pokemon_species||[]).map(s=>s.name));
    }

    // Fetch lightweight pokemon data for list display
    async function fetchPokemonSummary(name) {
      const p = await cachedFetchJson(`${API_BASE}/pokemon/${name}`);
      return {
        id:      p.id,
        name:    p.name,
        sprite:  p.sprites?.front_default || "",

      };
    }

    function meetsStatFilters(stats) {
      const getVal = key => (stats.find(s=>s.stat.name===key)?.base_stat ?? 0);
      const checks = [
        [el("minHp"),     "hp"],
        [el("minAtk"),    "attack"],
        [el("minDef"),    "defense"],
        [el("minSpAtk"),  "special-attack"],
        [el("minSpDef"),  "special-defense"],
        [el("minSpeed"),  "speed"]
      ];
      for (const [input, key] of checks) {
        const min = parseInt(input.value);
        if (!isNaN(min) && min > 0 && getVal(key) < min) return false;
      }
      const minBst = parseInt(el("minBst").value);
      if (!isNaN(minBst) && minBst > 0) {
        const bst = stats.reduce((sum, s) => sum + s.base_stat, 0);
        if (bst < minBst) return false;
      }
      return true;
    }

    function hasStatFilters() {
      const ids = ["minHp","minAtk","minDef","minSpAtk","minSpDef","minSpeed","minBst"];
      return ids.some(id => { const v = parseInt(el(id).value); return !isNaN(v) && v > 0; });
    }

    async function runAdvancedSearch() {
      advErrorText.textContent = "";
      const t1  = typeFilter1.value;
      const t2  = typeFilter2.value;
      const gen = genFilter.value;

      if (!t1 && !t2 && !gen) {
        advErrorText.textContent = "タイプまたは世代を1つ以上選択してください。";
        return;
      }
      if (t1 && t2 && t1 === t2) {
        advErrorText.textContent = "タイプ１とタイプ２に同じタイプは選択できません。";
        return;
      }

      advLoadingText.textContent = "検索中...";
      searchResultsCard.classList.remove("show");

      try {
        let candidateNames = null; // null = no restriction yet

        // ── Type filter ──
        if (t1) {
          const s1 = await fetchPokemonByType(t1);
          candidateNames = candidateNames ? new Set([...candidateNames].filter(n=>s1.has(n))) : s1;
        }
        if (t2) {
          const s2 = await fetchPokemonByType(t2);
          candidateNames = candidateNames ? new Set([...candidateNames].filter(n=>s2.has(n))) : s2;
        }

        // ── Generation filter ──
        if (gen) {
          const genSet = await fetchPokemonByGen(gen);
          // genSet contains species names; candidateNames contains pokemon form names
          // Map: species name → all forms. For simplicity, filter by matching base name.
          if (candidateNames === null) {
            // Build from gen set — fetch all pokemon in range
            const [min, max] = GEN_RANGES[gen];
            const ids = [];
            for (let i = min; i <= max; i++) ids.push(String(i));
            candidateNames = new Set(ids);
          } else {
            // Filter existing set: keep if the species name matches
            // Pokemon names often match species names (base forms)
            const genData = await cachedFetchJson(`${API_BASE}/generation/${gen}`);
            const genSpecies = new Set((genData.pokemon_species||[]).map(s=>s.name));
            candidateNames = new Set([...candidateNames].filter(n => {
              // strip form suffix
              const base = n.replace(/-(?:mega|alola|galar|hisui|paldea|attack|defense|speed|plant|sandy|trash|heat|wash|frost|fan|mow|origin|altered|land|sky|red-striped|blue-striped|normal|zen|standard|incarnate|therian|white|black|resolute|ordinary|pirouette|aria|star|unbound|complete|midday|midnight|dusk|dusk-mane|dawn-wings|ultra|school|solo|disguised|busted|original|hangry|ice|noice|crowned|eternamax|single-strike|rapid-strike|ice-rider|shadow-rider|hero|teal-mask|wellspring-mask|hearthflame-mask|cornerstone-mask|combat-breed|blaze-breed|aqua-breed)$/,"").replace(/-\d+$/,"");
              return genSpecies.has(n) || genSpecies.has(base);
            }));
          }
        }

        if (!candidateNames || candidateNames.size === 0) {
          advLoadingText.textContent = "";
          advErrorText.textContent = "条件に合うポケモンが見つかりませんでした。";
          return;
        }

        const nameList = [...candidateNames];

        // ── Stat filter (requires fetching each pokemon) ──
        const needStats = hasStatFilters();
        let filtered = [];

        if (needStats) {
          advLoadingText.textContent = `フィルター適用中 (0/${nameList.length})...`;
          let done = 0;
          // Fetch in small batches to avoid flooding
          const BATCH = 10;
          for (let i = 0; i < nameList.length; i += BATCH) {
            const batch = nameList.slice(i, i + BATCH);
            const results = await Promise.allSettled(batch.map(n => fetchPokemonSummary(n)));
            for (const r of results) {
              if (r.status === "fulfilled" && meetsStatFilters(r.value.stats)) {
                filtered.push(r.value);
              }
            }
            done += batch.length;
            advLoadingText.textContent = `フィルター適用中 (${Math.min(done, nameList.length)}/${nameList.length})...`;
          }
        } else {
          // Just get basic info
          advLoadingText.textContent = `リスト取得中 (0/${nameList.length})...`;
          const BATCH = 20;
          let done = 0;
          for (let i = 0; i < nameList.length; i += BATCH) {
            const batch = nameList.slice(i, i + BATCH);
            const results = await Promise.allSettled(batch.map(n => fetchPokemonSummary(n)));
            for (const r of results) {
              if (r.status === "fulfilled") filtered.push(r.value);
            }
            done += batch.length;
            advLoadingText.textContent = `リスト取得中 (${Math.min(done, nameList.length)}/${nameList.length})...`;
          }
        }

        // Sort by id
        filtered.sort((a,b) => a.id - b.id);

        // Apply strict dual-type filter (both types must exactly match)
        if (t1 && t2) {
          filtered = filtered.filter(p => p.types.includes(t1) && p.types.includes(t2));
        } else if (t1) {
          filtered = filtered.filter(p => p.types.includes(t1));
        } else if (t2) {
          filtered = filtered.filter(p => p.types.includes(t2));
        }

        advLoadingText.textContent = "";

        if (!filtered.length) {
          advErrorText.textContent = "条件に合うポケモンが見つかりませんでした。";
          return;
        }

        advResults  = filtered;
        currentPage = 1;
        renderResultsPage();

      } catch(e) {
        advLoadingText.textContent = "";
        advErrorText.textContent = "検索中にエラーが発生しました。しばらく待ってから再試行してください。";
        console.error(e);
      }
    }

    function renderResultsPage() {
      const total = advResults.length;
      const pages = Math.ceil(total / PAGE_SIZE);
      const start = (currentPage - 1) * PAGE_SIZE;
      const slice = advResults.slice(start, start + PAGE_SIZE);

      let label = "";
      const t1 = typeFilter1.value, t2 = typeFilter2.value, gen = genFilter.value;
      const parts = [];
      if (t1) parts.push(TYPE_JA[t1] || t1);
      if (t2) parts.push(TYPE_JA[t2] || t2);
      if (gen) parts.push(`第${gen}世代`);
      label = parts.join(" / ");

      resultsTitle.textContent = `${label} の検索結果`;
      resultsCount.textContent = `${total} 件 (${currentPage}/${pages} ページ)`;

      resultsList.innerHTML = "";
      slice.forEach(p => {
        const item = document.createElement("div");
        item.className = "poke-result-item";
        item.innerHTML = `
          <img src="${escapeHtml(p.sprite)}" alt="${escapeHtml(p.name)}" loading="lazy">
          <span class="poke-no">No.${p.id}</span>
          <div>
            <div class="poke-name">${escapeHtml(p.name)}</div>
            <div class="poke-types">
              ${p.types.map(t=>`<span class="type-chip type-${t}">${TYPE_JA[t]||t}</span>`).join("")}
            </div>
          </div>
        `;
        item.addEventListener("click", () => {
          searchInput.value = p.name;
          loadPokemonDetail(p.name);
        });
        resultsList.appendChild(item);
      });

      // Pager
      pager.innerHTML = "";
      if (pages > 1) {
        const prev = document.createElement("button");
        prev.textContent = "◀ 前";
        prev.disabled = currentPage === 1;
        prev.addEventListener("click", () => { currentPage--; renderResultsPage(); });
        const info = document.createElement("span");
        info.className = "page-info";
        info.textContent = `${currentPage} / ${pages}`;
        const next = document.createElement("button");
        next.textContent = "次 ▶";
        next.disabled = currentPage === pages;
        next.addEventListener("click", () => { currentPage++; renderResultsPage(); });
        pager.append(prev, info, next);
      }

      searchResultsCard.classList.add("show");
      searchResultsCard.scrollIntoView({ behavior:"smooth", block:"start" });
    }

    function resetAdvanced() {
      typeFilter1.value = "";
      typeFilter2.value = "";
      genFilter.value   = "";
      ["minHp","minAtk","minDef","minSpAtk","minSpDef","minSpeed","minBst"].forEach(id => el(id).value = "");
      advLoadingText.textContent = "";
      advErrorText.textContent   = "";
      advResults  = [];
      searchResultsCard.classList.remove("show");
    }

    // ── Event Listeners ──
    searchBtn.addEventListener("click",  searchPokemon);
    clearBtn.addEventListener("click",   clearResult);
    searchInput.addEventListener("keydown", e => { if (e.key === "Enter") searchPokemon(); });

    advSearchBtn.addEventListener("click", runAdvancedSearch);
    advClearBtn.addEventListener("click",  resetAdvanced);
    resultsCloseBtn.addEventListener("click", () => searchResultsCard.classList.remove("show"));

    statToggle.addEventListener("click", () => {
      const open = statPanel.style.display === "block";
      statPanel.style.display = open ? "none" : "block";
      statToggle.textContent = open ? "▸ 種族値フィルター" : "▾ 種族値フィルター";
      statToggle.classList.toggle("active", !open);
    });

    addToPartyBtn.addEventListener("click", () => {
      if (!currentPokemonData) { partyAddStatus.textContent = "先にポケモンを検索してください"; return; }
      savePartyCandidate(currentPokemonData);
    });

    // ── ページ表示と同時に日本語名マップをバックグラウンド先読み ──
    (function initJaNameMap() {
      // JA_TO_ENで足りないポケモン向けにAPIマップを裏で構築
      mapStatus.textContent = "🔄 日本語名マップ準備中...";
      mapBuildPromise = buildJaNameMap()
        .then(() => {
          mapReady = true;
          mapStatus.textContent = "✅ 日本語名 全ポケモン検索OK";
          setTimeout(() => { mapStatus.textContent = ""; }, 3000);
        })
        .catch(() => {
          mapReady = true;
          mapStatus.textContent = "";
        });
    })();
  })();
  </script>
</body>
</html>
